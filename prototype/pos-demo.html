<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Geek Pop-up POS (DEMO)</title>
<meta name="theme-color" content="#1A00B8">
<style id="pageStyle"></style>
<style>
:root{
  --blue:#1A00B8; --blue-soft:#ECE9FF; --orange:#F7941D; --orange-soft:#FFF1DE;
  --ink:#1b1b2f; --mute:#6b6b80; --line:#e3e3ee; --bg:#f6f6fb; --ok:#14804a; --bad:#c62828;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,-apple-system,sans-serif;font-size:17px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
header{background:var(--blue);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;font-weight:700}
header h1 span{color:var(--orange)}
#nextNo{font-size:14px;opacity:.9;margin-left:auto}
.hbtn{background:rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:10px;font-size:15px}
main{display:grid;grid-template-columns:1fr 390px;gap:16px;padding:16px;max-width:1200px;margin:0 auto;align-items:start}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(20,0,120,.08)}
.step{display:flex;align-items:center;gap:10px;font-weight:700;margin:0 0 12px;font-size:18px}
.step b{background:var(--blue);color:#fff;min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.step small{font-weight:400;color:var(--mute);font-size:14px}
.step .cnt{margin-left:auto;background:var(--blue-soft);color:var(--blue);font-weight:700;padding:3px 10px;border-radius:20px;font-size:14px}
.sec{margin-bottom:22px}
.hint{color:var(--mute);font-size:14px;margin:8px 0 0}
.gt{font-weight:700;color:var(--mute);font-size:15px;margin:14px 0 8px}
.bases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.base{border:3px solid var(--line);border-radius:16px;padding:8px 8px 10px;text-align:center;background:#fff}
.base .pic{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block;pointer-events:none}
.base .nm{font-weight:700;margin-top:8px}
.base small{display:block;color:var(--mute)}
.base.on{border-color:var(--blue);background:var(--blue-soft)}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.size{border:3px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-weight:700;background:#fff}
.size small{display:block;color:var(--mute);font-weight:400;margin-top:2px;font-size:13px}
.size small b{color:var(--ink);font-size:17px}
.size.on{border-color:var(--orange);background:var(--orange-soft)}
.tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.top{border:2px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;background:#fff;line-height:1.25}
.top small{display:block;color:var(--mute);font-size:13px}
.top.on{border-color:var(--blue);background:var(--blue-soft);font-weight:700}
.top.on small{color:var(--blue)}
.top.on::before{content:"✓ "}
.top.on.over{border-color:var(--orange);background:var(--orange-soft)}
.top.on.over small{color:#b45f00}
.swapgrid{margin:-2px 0 12px;padding:10px;background:var(--bg);border-radius:12px}
.comp{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.comp.changed{border-color:var(--orange);background:var(--orange-soft)}
.comp .nm{flex:1;font-weight:700}
.comp .nm small{display:block;font-weight:400;color:var(--mute);font-size:14px}
.comp button{background:var(--bg);padding:8px 14px;border-radius:10px;font-weight:700;font-size:15px}
.comp button.skip{background:none;color:var(--mute);font-weight:400;font-size:13px;text-decoration:underline;padding:8px 6px}
.comp.removed{background:var(--bg)}
.comp.removed .nm{color:var(--mute)}
.comp.removed .nm{text-decoration:line-through}
.comp.removed .nm small{text-decoration:none}
.topw{position:relative}
.topw .top{width:100%;height:100%}
.minus{position:absolute;top:-7px;right:-5px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-size:22px;line-height:1;font-weight:700;display:grid;place-items:center;z-index:1}
.honey{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.hon{border:3px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;font-weight:700;background:#fff}
.hon.on{border-color:var(--orange);background:var(--orange-soft)}
input.note{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font:inherit}
.add{width:100%;background:var(--orange);color:#fff;font-weight:700;font-size:20px;padding:16px;border-radius:16px;position:sticky;bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.add:disabled{background:#d8d8e4;box-shadow:none}
.cart h2{margin:0 0 10px;font-size:19px}
.empty{color:var(--mute);text-align:center;padding:24px 0}
.line{border-bottom:1px solid var(--line);padding:10px 0}
.line .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.line .d{color:var(--mute);font-size:14.5px;margin:2px 0 6px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:38px;height:38px;border-radius:10px;background:var(--bg);font-size:22px;font-weight:700}
.qty .rm{margin-left:auto;width:auto;padding:0 12px;font-size:14px;color:var(--bad);background:none}
.total{display:flex;justify-content:space-between;font-size:24px;font-weight:800;padding:14px 0 10px}
.pay{width:100%;background:var(--blue);color:#fff;font-weight:700;font-size:20px;padding:16px;border-radius:16px}
.pay:disabled{background:#c9c9de}
.clear{width:100%;margin-top:8px;color:var(--bad);padding:11px;border:2px solid var(--line);border-radius:12px;font-weight:700}
.clear:disabled{opacity:.4}
.bar{display:none}
#modal{position:fixed;inset:0;background:rgba(10,10,40,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal.show{display:flex}
.box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:540px;max-height:92vh;overflow:auto}
.box.wide{max-width:940px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.tab{padding:10px 14px;border-radius:12px;background:var(--bg);font-weight:700;font-size:15px}
.tab.on{background:var(--blue);color:#fff}
.rangebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rangebar input{font:inherit;padding:8px;border:2px solid var(--line);border-radius:10px}
.chip{background:var(--bg);padding:8px 12px;border-radius:20px;font-size:14px;font-weight:700}
th.n,td.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
.sec2{font-weight:800;margin:18px 0 6px;font-size:17px}
.sec2 small{font-weight:400;color:var(--mute);font-size:13px}
.note2{color:var(--mute);font-size:13px;margin:6px 0}
.share{height:7px;background:var(--blue-soft);border-radius:4px;overflow:hidden;min-width:70px;margin-top:3px}
.share i{display:block;height:100%;background:var(--blue)}
.box h3{margin:0 0 12px;font-size:21px}
.q2{font-weight:700;margin:14px 0 4px;color:var(--mute);font-size:15px}
.row{display:flex;gap:10px;margin:8px 0}
.row>*{flex:1}
.row.wrap{flex-wrap:wrap}
.row.wrap>*{flex:1 1 140px}
.opt{border:3px solid var(--line);border-radius:14px;padding:14px 8px;font-weight:700;text-align:center}
.opt.on{border-color:var(--blue);background:var(--blue-soft)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.quick button{background:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700}
input.num{width:100%;font-size:26px;padding:12px;border:2px solid var(--line);border-radius:12px;text-align:right;font-family:inherit}
.change{font-size:30px;font-weight:800;color:var(--ok);text-align:center;margin:12px 0}
.big{font-size:56px;text-align:center}
.ghost{background:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr.void td{color:#aaa;text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--blue-soft);border-radius:14px;padding:12px}
.stat small{color:var(--mute);display:block}
.stat b{font-size:22px}
.sbtn{color:var(--blue);font-size:14px;padding:4px 8px;font-weight:700}
.vbtn{color:var(--bad);font-size:14px;padding:4px 8px}
.rbtn{color:var(--ok);font-size:14px;padding:4px 8px;font-weight:700}
tr.void td:last-child{text-decoration:none;color:inherit}
textarea.csvbox{width:100%;height:180px;font:13px/1.4 monospace;border:2px solid var(--line);border-radius:10px;padding:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:30}
#printArea{display:none}
#printArea .slip{font-family:"Noto Sans Thai","Sarabun",sans-serif;color:#000}
#printArea .c{text-align:center}
#printArea .b{font-weight:700}
#printArea .lg{font-size:15px}
#printArea .r{display:flex;justify-content:space-between;gap:8px}
#printArea .sm{font-size:11px;padding-left:8px;color:#000}
#printArea hr{border:0;border-top:1px dashed #000;margin:5px 0}
#printArea .no{font-size:54px;font-weight:800;text-align:center;line-height:1.05}
#printArea .dine{font-size:26px;font-weight:800;text-align:center;background:#000;color:#fff;padding:3px 0;margin:4px 0}
#printArea .kt{font-size:17px;font-weight:800;margin-top:6px}
#printArea .kl{font-size:14px;padding-left:8px}
@media(max-width:900px){
  main{grid-template-columns:1fr;padding:12px 12px 100px}
  .add{bottom:86px}
  .bar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;gap:10px;align-items:center;z-index:6}
  .bar .sum{flex:1;font-weight:800;font-size:20px}
  .bar .sum small{display:block;font-weight:400;color:var(--mute);font-size:13px}
  .bar button{background:var(--blue);color:#fff;font-weight:700;padding:14px 22px;border-radius:14px;font-size:18px}
  .bar button:disabled{background:#c9c9de}
}
@media print{
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .slip{width:var(--paper,80mm);padding:2mm 3mm;font-size:12px;line-height:1.35;break-after:page;page-break-after:always}
  #printArea .slip:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>

<header>
  <h1>Geek <span>Pop-up</span> POS · DEMO</h1>
  <span id="nextNo"></span>
  <button class="hbtn" id="btnReseed" style="margin-right:6px">🔄 ข้อมูลตัวอย่างใหม่</button>
  <button class="hbtn" id="btnSummary">📊 สรุปยอด</button>
</header>

<main>
  <section class="card">
    <div id="builder"></div>
    <button class="add" id="btnAdd" disabled>เลือกเมนูก่อน</button>
  </section>

  <aside class="card cart">
    <h2>ออเดอร์ปัจจุบัน</h2>
    <div id="cart"></div>
    <div class="total"><span>รวม</span><span id="total">฿0</span></div>
    <button class="pay" id="btnPay" disabled>ชำระเงิน</button>
    <button class="clear" id="btnClear">ล้างออเดอร์</button>
  </aside>
</main>

<div class="bar">
  <div class="sum"><small id="barCount">0 รายการ</small><span id="barTotal">฿0</span></div>
  <button id="btnPay2" disabled>ชำระเงิน</button>
</div>

<div id="modal"></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
/* ===== js/core.js ===== */
/* ฟังก์ชันพื้นฐาน: จัดรูปแบบ วันที่ รอบขาย ป้ายข้อความ (ไม่แตะ DOM) */
const baht = n => '฿' + Number(n).toLocaleString('th-TH');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n, l=2) => String(n).padStart(l, '0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDT = ts => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const byId = list => Object.fromEntries(list.map(x => [x.id, x]));
const ITEM = Object.fromEntries(CONFIG.items.map(x => [x.name, x]));
const MENU = byId(CONFIG.menus), METHOD = byId(CONFIG.methods), HONEY = byId(CONFIG.honey), DINE = byId(CONFIG.dining);

/* รอบขายเปลี่ยนวันตอน 23:00 น. */
function bizDate(d){ const x = new Date(d); if(x.getHours() >= CONFIG.resetHour) x.setDate(x.getDate()+1); return dateKey(x); }

const addDays = (k, n) => { const [y, m, d] = k.split('-').map(Number); return dateKey(new Date(y, m - 1, d + n)); };

const itemTitle = i => i.name + (i.sizeName ? ' · ' + i.sizeName : '');
const topLabel = t => t.removed ? 'ไม่รับ ' + t.name : t.name + (t.n > 1 ? ' ×' + t.n : '') + (t.from ? ` (แทน ${t.from})` : '') + (t.extra ? ` (+${t.extra})` : '');
function itemLines(i){
  const L = [];
  if(i.tops.length) L.push(i.tops.map(topLabel).join(', '));
  else if(i.menu === 'greek') L.push('ไม่มีท็อปปิ้ง');
  L.push('น้ำผึ้ง: ' + HONEY[i.honey].name);
  if(i.note) L.push('หมายเหตุ: ' + i.note);
  return L;
}

function historyText(s){ return (s.log || []).map(l => `${l.act === 'void' ? 'ยกเลิก' : 'นำกลับ'} ${fmtDT(l.at)}`).join(' / '); }

function csvText(rows){ const q = v => `"${String(v).replace(/"/g, '""')}"`; return rows.map(r => r.map(q).join(',')).join('\r\n'); }
</script>
<script>
/* ===== js/pricing.js ===== */
/* คิดราคา: ฟังก์ชันล้วน ไม่แตะ DOM และไม่อ่าน state ของหน้าจอ (เทสต์ได้ตรงๆ)
   m = เมนูจาก CONFIG.menus · st = {size, picks, comps} แบบเดียวกับ sel */
function priceItem(m, st){
  if(!m) return null;
  if(m.sizes){
    const s = m.sizes.find(x => x.id === st.size);
    let unit = s.price, free = 0; const tops = [];
    if(!s.noTop) st.picks.forEach(n => {           // เลือกซ้ำได้ (Banana ×3) นับทีละชิ้น
      const it = ITEM[n]; let extra = 0;
      if(it.price > 0) extra = it.price;
      else { free++; if(free > CONFIG.freeToppingCount) extra = CONFIG.overToppingPrice; }
      unit += extra;
      let t = tops.find(x => x.name === n);
      if(!t){ t = {name:n, n:0, extra:0, from:null}; tops.push(t); }
      t.n++; t.extra += extra;
    });
    return {unit, tops, sizeName: s.name + (s.noTop ? ' · ไม่มีท็อปปิ้ง' : ''), freeUsed:free, noTop:!!s.noTop};
  }
  const tops = st.comps.map((n, i) => n === null
    ? {name:m.defaults[i], n:1, extra:0, from:null, removed:true}
    : {name:n, n:1, extra:0, from: n !== m.defaults[i] ? m.defaults[i] : null});
  return {unit:m.price, tops, sizeName:'', freeUsed:0, noTop:false};
}

/* คำนวณราคารายการที่กำลังเลือกอยู่บนหน้าจอ */
const priceSel = () => priceItem(curMenu(), sel);

const menuPriceLabel = m => m.sizes ? (() => { const p = m.sizes.map(s => s.price); const lo = Math.min(...p), hi = Math.max(...p); return lo === hi ? baht(lo) : baht(lo)+'–'+hi; })() : baht(m.price);
</script>
<script>
/* ===== js/store.js ===== */
/* เก็บยอดขาย: IndexedDB เป็นที่เก็บหลัก + สำเนาสำรองใน localStorage
   - ตอนเปิดหน้า (storeReady) อ่านบิลจาก IndexedDB และ localStorage มารวมกัน แล้วถือไว้ในหน่วยความจำ
     ข้อมูลจากต้นแบบเดิม (localStorage key เดียวกัน) จึงถูกย้ายเข้า IndexedDB อัตโนมัติ และไม่ลบของเดิม
   - loadSales() / saveSales() ยังเป็นแบบ sync เหมือนเดิม ส่วนการเขียนลง IndexedDB ทำเบื้องหลังเฉพาะบิลที่เปลี่ยน
   - saveSales เพิ่มหรือแก้บิลได้อย่างเดียว ไม่ลบ (บิลที่ไม่อยู่ใน list ยังอยู่ครบ) ลบทั้งหมดได้ทาง clearSales() ซึ่งใช้เฉพาะ DEMO
   - ถ้าเบราว์เซอร์ไม่มี IndexedDB ใช้ localStorage อย่างเดียว ถ้าไม่มีทั้งคู่ใช้หน่วยความจำ + แถบเตือน */
const KEY = 'geek_popup_sales_DEMO2';
const DB_STORE = 'sales';

let ROWS = [];               // JSON ของแต่ละบิล เรียงตามลำดับที่บันทึก
const ROW_AT = new Map();    // id → ตำแหน่งใน ROWS
let DB = null, STORE_MODE = 'loading', LS_OK = true, DB_FAILS = 0;

function storeBanner(id, text){
  if(document.getElementById(id)) return;
  const b = document.createElement('div'); b.id = id;
  b.style.cssText = 'background:#c62828;color:#fff;text-align:center;padding:6px 10px;font-size:14px';
  b.textContent = text;
  document.body.prepend(b);
}
function memMode(){
  STORE_MODE = 'memory';
  storeBanner('memBanner', '⚠️ เบราว์เซอร์นี้ไม่ให้บันทึกข้อมูลถาวร ยอดขายจะหายเมื่อปิดหน้า กรุณาส่งออก CSV ก่อนปิด');
}

/* บิลที่ log ยาวกว่าคือฉบับใหม่กว่า (log เพิ่มได้อย่างเดียว) เท่ากันใช้ตัวแรก */
const newerSale = (a, b) => ((b.log || []).length > (a.log || []).length ? b : a);
function putRow(s){
  const j = JSON.stringify(s);
  if(ROW_AT.has(s.id)){ const i = ROW_AT.get(s.id); if(ROWS[i] === j) return false; ROWS[i] = j; }
  else { ROW_AT.set(s.id, ROWS.length); ROWS.push(j); }
  return true;
}

const idbReq = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
function openDb(){
  return new Promise((ok, no) => {
    const r = indexedDB.open(KEY, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE, {keyPath: 'id'});
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); r.onblocked = () => no(new Error('blocked'));
  });
}
function dbWrite(list, clear){
  if(!DB) return;
  try{
    const tx = DB.transaction(DB_STORE, 'readwrite'), st = tx.objectStore(DB_STORE);
    if(clear) st.clear();
    list.forEach(s => st.put(s));
    tx.onabort = dbFailed;     // request ที่ error จะทำให้ทั้ง transaction ถูก abort
  }catch(e){ dbFailed(); }
}
function dbFailed(){
  DB_FAILS++; console.error('IndexedDB write failed');
  if(!LS_OK) storeBanner('dbBanner', '⚠️ บันทึกยอดขายลงเครื่องไม่สำเร็จ กรุณาส่งออก CSV ทันที แล้วแจ้งผู้ดูแล');
}
function lsRead(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ LS_OK = false; return null; }
}
function lsWrite(){
  if(!LS_OK && DB) return;     // พื้นที่ localStorage เต็มแล้ว ใช้ IndexedDB อย่างเดียว
  try{ localStorage.setItem(KEY, '[' + ROWS.join(',') + ']'); LS_OK = true; }
  catch(e){ LS_OK = false; if(!DB) memMode(); }
}

async function openStore(){
  const fromLs = lsRead();
  let fromDb = null;
  if(typeof indexedDB !== 'undefined'){
    try{ DB = await openDb(); fromDb = await idbReq(DB.transaction(DB_STORE).objectStore(DB_STORE).getAll()); }
    catch(e){ DB = null; }
  }
  if(!DB && fromLs === null){ memMode(); return; }
  STORE_MODE = DB ? 'indexeddb' : 'localstorage';
  /* รวมสองแหล่ง: เรียงตาม id (= เวลาที่ขาย) ถ้ามีทั้งคู่ใช้ฉบับที่ log ยาวกว่า */
  const byId = new Map();
  (fromDb || []).forEach(s => byId.set(s.id, s));
  (fromLs || []).forEach(s => byId.set(s.id, byId.has(s.id) ? newerSale(byId.get(s.id), s) : s));
  [...byId.values()].sort((a, b) => a.id - b.id).forEach(putRow);
  const dbIds = new Map((fromDb || []).map(s => [s.id, JSON.stringify(s)]));
  const missing = ROWS.map(j => JSON.parse(j)).filter(s => dbIds.get(s.id) !== JSON.stringify(s));
  if(missing.length) dbWrite(missing);                    // migration จาก localStorage (และบิลที่ IndexedDB ตกหล่น)
  if(ROWS.length) lsWrite();                              // สำเนาสำรองให้ตรงกัน
  if(DB && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});  // ขอไม่ให้เบราว์เซอร์ล้างข้อมูลเอง
}
const storeReady = openStore().catch(e => { console.error(e); memMode(); });

function loadSales(){ return JSON.parse('[' + ROWS.join(',') + ']'); }
function saveSales(list){
  const changed = list.filter(putRow);
  if(changed.length){ dbWrite(changed); lsWrite(); }
  return true;
}
/* ลบบิลทั้งหมด · ใช้เฉพาะปุ่มสร้างข้อมูลตัวอย่างใหม่ใน DEMO ห้ามใช้กับข้อมูลจริง */
function clearSales(){
  ROWS = []; ROW_AT.clear();
  dbWrite([], true); LS_OK = true; lsWrite();
}
function nextNo(){ const biz = bizDate(new Date()); return (loadSales().filter(s => s.date === biz).length % 999) + 1; }
</script>
<script>
/* ===== js/reports.js ===== */
/* ====== รายงานสรุป: คำนวณตัวเลข (ไม่แตะ DOM) ====== */
const REP = {from:null, to:null, tab:'items', fb:false};

const thDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'}); };
function roundLabel(from, to){
  const start = k => `${thDate(addDays(k, -1))} ${pad(CONFIG.resetHour)}:00`, end = k => `${thDate(k)} ${pad(CONFIG.resetHour - 1)}:59`;
  return from === to ? `รอบขาย ${thDate(from)} (${start(from)} – ${end(from)})` : `รอบขาย ${thDate(from)} – ${thDate(to)} (${start(from)} – ${end(to)})`;
}
/* รอบที่จะเปิดให้ดู: รอบปัจจุบัน ถ้ายังไม่มีบิลให้ใช้รอบล่าสุดที่มีการขาย */
function defaultRound(){
  const cur = bizDate(new Date()), sales = loadSales();
  if(sales.some(x => x.date === cur)) return {date:cur, fallback:false};
  const past = sales.map(x => x.date).filter(d => d < cur).sort();
  return past.length ? {date:past[past.length - 1], fallback:true} : {date:cur, fallback:false};
}

function setRange(k){
  const today = bizDate(new Date());
  REP.fb = false;
  if(k === 'yday') REP.from = REP.to = addDays(today, -1);
  else if(k === '7d'){ REP.from = addDays(today, -6); REP.to = today; }
  else if(k === 'all'){ const ds = loadSales().map(x => x.date).sort(); REP.from = ds[0] || today; REP.to = ds[ds.length - 1] || today; }
  else REP.from = REP.to = today;
}
const pct = (v, t) => t ? Math.round(v * 1000 / t) / 10 : 0;

/* รวมตัวเลขทั้งหมดจากบิลที่ไม่ถูกยกเลิก */
function buildReport(from, to){
  const all = loadSales().filter(x => x.date >= from && x.date <= to);
  const ok = all.filter(x => !x.void);
  const R = {all, ok, voided: all.length - ok.length, total: ok.reduce((a, x) => a + x.total, 0), bills: ok.length, cups: 0,
             items: {}, methods: {}, groups: {}, ingr: {}};
  const grp = (g, unit, o, qty, rev) => { const G = R.groups[g] || (R.groups[g] = {unit, rows:{}}); const r = G.rows[o] || (G.rows[o] = {qty:0, rev:0}); r.qty += qty; r.rev += rev; };
  const ing = (sec, name, qty) => { const k = sec + '|' + name; (R.ingr[k] = R.ingr[k] || {sec, name, qty:0}).qty += qty; };
  CONFIG.methods.forEach(m => R.methods[m.id] = {bills:0, rev:0});
  ok.forEach(sale => {
    if(R.methods[sale.method]){ R.methods[sale.method].bills++; R.methods[sale.method].rev += sale.total; }
    grp('กินเลย / กลับบ้าน', 'บิล', DINE[sale.dining] ? DINE[sale.dining].name : String(sale.dining), 1, sale.total);
    sale.items.forEach(i => {
      const rev = i.unit * i.qty; R.cups += i.qty;
      const key = itemTitle(i);
      const it = R.items[key] || (R.items[key] = {menu:i.menu, name:key, qty:0, rev:0}); it.qty += i.qty; it.rev += rev;
      if(i.sizeName) grp('ขนาด', 'แก้ว', i.sizeName, i.qty, rev);
      grp('น้ำผึ้ง', 'แก้ว', HONEY[i.honey] ? HONEY[i.honey].name : String(i.honey), i.qty, rev);
      if(i.menu === 'greek') ing('base', 'Greek Yogurt (สกู๊ป)', (parseInt(i.sizeName, 10) || 1) * i.qty);
      else ing('base', i.name + ' base (ถ้วย)', i.qty);
      i.tops.forEach(t => {
        const n = (t.n || 1) * i.qty;
        if(t.removed){ grp('การปรับท็อปปิ้ง', 'แก้ว', `${i.name}: ไม่รับ ${t.name}`, i.qty, 0); return; }
        if(t.from) grp('การปรับท็อปปิ้ง', 'แก้ว', `${i.name}: เปลี่ยน ${t.from} → ${t.name}`, i.qty, 0);
        ing(ITEM[t.name] ? ITEM[t.name].cat : 'other', t.name, n);
        if(t.extra){
          const isExtra = ITEM[t.name] && ITEM[t.name].price > 0;
          const pcs = isExtra ? n : Math.round(t.extra / CONFIG.overToppingPrice) * i.qty;
          grp('ท็อปปิ้งที่คิดเงินเพิ่ม', 'ชิ้น', isExtra ? t.name : `${t.name} (เกิน ${CONFIG.freeToppingCount} ชิ้น)`, pcs, t.extra * i.qty);
        }
      });
      if(i.honey !== 'none') ing('honey', 'น้ำผึ้ง · ' + (HONEY[i.honey] ? HONEY[i.honey].name : i.honey), i.qty);
    });
  });
  return R;
}
</script>
<script>
/* ===== js/ui/modal.js ===== */
/* ---------- ตัวช่วยหน้าจอ: $, toast, modal, ยืนยัน, PIN ---------- */
const $ = id => document.getElementById(id);

function toast(msg){ const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(()=> t.style.display='none', 1800); }

/* ---------- Modal ---------- */
function openModal(html, wide){ $('modal').innerHTML = `<div class="box ${wide?'wide':''}">${html}</div>`; $('modal').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); $('modal').innerHTML = ''; }
/* หน้าต่างยืนยัน/PIN ของระบบเอง (ไม่ใช้ confirm/prompt ของเบราว์เซอร์ เพราะบางโหมดเปิดไฟล์จะถูกบล็อก) */
let confirmCb = null, confirmNo = null, pinCb = null;
function askConfirm(o){
  confirmCb = o.onYes || null; confirmNo = o.onNo || null;
  openModal(`<h3>${esc(o.msg)}</h3>${o.sub ? `<p style="color:var(--mute);margin:0 0 6px">${esc(o.sub)}</p>` : ''}
    <div class="row"><button class="ghost" id="cfNo">กลับ</button><button class="pay" id="cfYes" style="background:${o.ok ? 'var(--ok)' : 'var(--bad)'}">${esc(o.yes || 'ยืนยัน')}</button></div>`);
}
function askPin(onOk, err){
  pinCb = onOk;
  openModal(`<h3>ใส่ PIN</h3>
    <input class="num" id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" style="text-align:center;letter-spacing:8px">
    ${err ? `<p style="color:var(--bad);margin:8px 0 0">${esc(err)}</p>` : ''}
    <div class="row"><button class="ghost" id="pinNo">ยกเลิก</button><button class="pay" id="pinOk">ตกลง</button></div>`);
  const i = $('pinIn'); i.focus(); i.onkeydown = e => { if(e.key === 'Enter') checkPin(); };
}
function checkPin(){
  const v = $('pinIn').value;
  if(v === CONFIG.pin){ const cb = pinCb; pinCb = null; if(cb) cb(); }
  else askPin(pinCb, 'PIN ไม่ถูกต้อง');
}
</script>
<script>
/* ===== js/ui/print.js ===== */
/* ---------- Print: ใบเสร็จลูกค้า + ตั๋วครัว ---------- */
function receiptHtml(s){
  const lines = s.items.map(i =>
    `<div class="r"><span>${esc(itemTitle(i))}${i.qty > 1 ? ' ×' + i.qty : ''}</span><span>${i.unit * i.qty}</span></div>` +
    itemLines(i).map(l => `<div class="sm">${esc(l)}</div>`).join('')).join('');
  return `<div class="slip">
    <div class="c b lg">${esc(CONFIG.shopName)}</div><div class="c">${esc(CONFIG.shopSub)}</div><hr>
    <div class="r b"><span>ออเดอร์ #${pad(s.no, 3)}</span><span>${esc(DINE[s.dining].name)}</span></div>
    <div>${fmtDT(s.ts)}</div>${s.void ? '<div class="c b">*** ยกเลิกบิล ***</div>' : ''}<hr>
    ${lines}<hr>
    <div class="r b lg"><span>รวม</span><span>${baht(s.total)}</span></div>
    <div class="r"><span>ชำระด้วย</span><span>${esc(METHOD[s.method].name)}</span></div>
    ${s.method === 'cash' ? `<div class="r"><span>รับเงิน</span><span>${baht(s.received)}</span></div><div class="r"><span>เงินทอน</span><span>${baht(s.change)}</span></div>` : ''}
    <hr><div class="c">ขอบคุณที่อุดหนุนครับ/ค่ะ</div></div>`;
}
function kitchenHtml(s){
  const items = s.items.map(i => {
    let l = '';
    if(i.tops.length) i.tops.forEach(t => { l += t.removed ? `<div class="kl"><b>- ไม่รับ ${esc(t.name)}</b></div>` : `<div class="kl">- ${esc(t.name)}${t.n > 1 ? ` <b>×${t.n}</b>` : ''}${t.from ? ` <b>(เปลี่ยนจาก ${esc(t.from)})</b>` : ''}${t.extra ? ` (+${t.extra})` : ''}</div>`; });
    else if(i.menu === 'greek') l += '<div class="kl">- ไม่มีท็อปปิ้ง</div>';
    l += `<div class="kl">น้ำผึ้ง: <b>${esc(HONEY[i.honey].name)}</b></div>`;
    if(i.note) l += `<div class="kl"><b>หมายเหตุ: ${esc(i.note)}</b></div>`;
    return `<div class="kt">${i.qty} × ${esc(itemTitle(i))}</div>${l}`;
  }).join('');
  return `<div class="slip">
    <div class="no">#${pad(s.no, 3)}</div>
    <div class="dine">${esc(DINE[s.dining].name)}</div>
    <div class="c">${fmtDT(s.ts)}</div>${s.void ? '<div class="c b">*** ยกเลิกบิล ***</div>' : ''}<hr>${items}</div>`;
}
function printSale(s, which){
  let h = '';
  if(which !== 'kitchen') h += receiptHtml(s);
  if(which !== 'receipt') h += kitchenHtml(s);
  $('printArea').innerHTML = h;
  setTimeout(() => window.print(), 80);
}
</script>
<script>
/* ===== js/ui/builder.js ===== */
/* ---------- Builder state ---------- */
let sel;
function resetSel(){ sel = {menu:null, size:null, picks:[], comps:[], swapSlot:null, honey:CONFIG.honeyDefault, note:''}; }
resetSel();
const curMenu = () => sel.menu ? MENU[sel.menu] : null;

function pickMenu(id){
  if(sel.menu === id) return;
  const m = MENU[id];
  sel = {menu:id, size:m.sizes ? 'g1' : null, picks:[], comps:m.defaults ? [...m.defaults] : [], swapSlot:null, honey:CONFIG.honeyDefault, note:''};
}

function sec(n, title, body, right=''){ return `<div class="sec"><p class="step"><b>${n}</b> ${title}${right}</p>${body}</div>`; }

function greekTopsHtml(P){
  const chip = it => {
    const t = P.tops.find(x => x.name === it.name), cnt = t ? t.n : 0;
    let tag;
    if(cnt) tag = t.extra ? '+' + t.extra : 'ฟรี';
    else if(it.price > 0) tag = '+' + it.price;
    else tag = P.freeUsed >= CONFIG.freeToppingCount ? '+' + CONFIG.overToppingPrice : 'ฟรี';
    return `<div class="topw"><button class="top ${cnt ? 'on':''} ${cnt && t.extra ? 'over':''}" data-pick="${esc(it.name)}">${esc(it.name)}${cnt > 1 ? ' ×' + cnt : ''}<small>${tag}</small></button>` +
      (cnt ? `<button class="minus" data-less="${esc(it.name)}" aria-label="ลด">−</button>` : '') + `</div>`;
  };
  let h = '';
  CONFIG.cats.forEach(c => {
    const list = CONFIG.items.filter(i => i.cat === c.id && i.price === 0);
    h += `<div class="gt">${c.name} · ฟรี</div><div class="tops">${list.map(chip).join('')}</div>`;
  });
  h += `<div class="gt">Extra · คิดเพิ่มตามราคา</div><div class="tops">${CONFIG.items.filter(i => i.price > 0).map(chip).join('')}</div>`;
  h += `<p class="hint">แตะซ้ำเพื่อเพิ่มจำนวน (เช่น Banana ×3) · กดปุ่ม − เพื่อลด<br>ฟรี ${CONFIG.freeToppingCount} ชิ้นแรก · ชิ้นที่ ${CONFIG.freeToppingCount+1} ขึ้นไป +${CONFIG.overToppingPrice} บาท/ชิ้น · Extra คิดตามราคาต่อชิ้น</p>`;
  return h;
}
function presetHtml(m){
  let h = '<p class="hint" style="margin:0 0 4px">เปลี่ยนท็อปปิ้งได้ฟรีในหมวดเดียวกัน (แต่ไม่แนะนำให้เปลี่ยน)</p>';
  m.defaults.forEach((d, i) => {
    const cur = sel.comps[i], removed = cur === null, ch = !removed && cur !== d;
    h += `<div class="comp ${ch ? 'changed' : ''} ${removed ? 'removed' : ''}"><div class="nm">${esc(removed ? d : cur)}<small>${removed ? 'ไม่รับ' : ch ? 'แทน ' + esc(d) : 'มาพร้อมเมนู'}</small></div>` +
         (ch || removed ? `<button class="skip" data-reset="${i}">${removed ? 'ใส่กลับ' : 'คืนค่า'}</button>` : '') +
         (!removed ? `<button class="skip" data-skip="${i}">ไม่รับ</button>` : '') +
         `<button data-swap="${i}">${sel.swapSlot === i ? 'ปิด' : 'เปลี่ยน'}</button></div>`;
    if(sel.swapSlot === i){
      const cat = ITEM[d].cat, used = sel.comps.filter((c, j) => j !== i && c !== null), banned = m.noSwap || [];
      const opts = CONFIG.items.filter(it => it.cat === cat && it.name !== cur && !used.includes(it.name) && !banned.includes(it.name));
      h += `<div class="tops swapgrid">` + (opts.map(it => `<button class="top" data-choose="${esc(it.name)}" data-slot="${i}">${esc(it.name)}<small>ฟรี</small></button>`).join('') || '<span class="hint">ไม่มีตัวเลือกอื่นในหมวดนี้</span>') + `</div>`;
    }
  });
  return h;
}
function renderBuilder(){
  const m = curMenu(), P = priceSel(); let n = 0;
  let h = sec(++n, 'เลือกเมนู', '<div class="bases">' + CONFIG.menus.map(x =>
    `<button class="base ${sel.menu === x.id ? 'on':''}" data-menu="${x.id}"><img class="pic" src="${x.img}" alt=""><div class="nm">${esc(x.name)}</div><small>${menuPriceLabel(x)}</small></button>`).join('') + '</div>');
  if(m){
    if(m.sizes){
      h += sec(++n, 'เลือกขนาด', '<div class="sizes">' + m.sizes.map(s =>
        `<button class="size ${sel.size === s.id ? 'on':''}" data-size="${s.id}">${esc(s.name)}<small>${esc(s.sub)}</small><small><b>${baht(s.price)}</b></small></button>`).join('') + '</div>');
      if(P.noTop) h += sec(++n, 'ท็อปปิ้ง', '<div class="empty" style="padding:6px 0">ขนาดนี้ไม่มีท็อปปิ้ง</div>');
      else h += sec(++n, 'ท็อปปิ้ง', greekTopsHtml(P), `<span class="cnt">ฟรี ${Math.min(P.freeUsed, CONFIG.freeToppingCount)}/${CONFIG.freeToppingCount}</span>`);
    } else {
      h += sec(++n, 'ท็อปปิ้งที่มากับเมนู', presetHtml(m));
    }
    h += sec(++n, 'น้ำผึ้ง <small>(ฟรี)</small>', '<div class="honey">' + CONFIG.honey.map(x =>
      `<button class="hon ${sel.honey === x.id ? 'on':''}" data-honey="${x.id}">${esc(x.name)}</button>`).join('') + '</div>');
    h += sec(++n, 'หมายเหตุ <small>(ถ้ามี)</small>', `<input class="note" id="note" placeholder="เช่น แพ้ถั่ว / ไม่เอาถ้วยใหญ่" value="${esc(sel.note)}">`);
  }
  $('builder').innerHTML = h;
  const add = $('btnAdd');
  add.disabled = !m;
  add.textContent = m ? `เพิ่มลงออเดอร์ · ${baht(P.unit)}` : 'เลือกเมนูก่อน';
}
$('builder').onclick = e => {
  const g = a => e.target.closest(`[data-${a}]`); let el;
  if(el = g('menu')) pickMenu(el.dataset.menu);
  else if(el = g('size')){ sel.size = el.dataset.size; if(MENU[sel.menu].sizes.find(s => s.id === sel.size).noTop) sel.picks = []; }
  else if(el = g('less')){ const i = sel.picks.lastIndexOf(el.dataset.less); if(i >= 0) sel.picks.splice(i, 1); }
  else if(el = g('pick')) sel.picks.push(el.dataset.pick);
  else if(el = g('choose')){ sel.comps[Number(el.dataset.slot)] = el.dataset.choose; sel.swapSlot = null; }
  else if(el = g('reset')){ const i = Number(el.dataset.reset); sel.comps[i] = MENU[sel.menu].defaults[i]; if(sel.swapSlot === i) sel.swapSlot = null; }
  else if(el = g('skip')){ const i = Number(el.dataset.skip); sel.comps[i] = null; if(sel.swapSlot === i) sel.swapSlot = null; }
  else if(el = g('swap')){ const i = Number(el.dataset.swap); sel.swapSlot = sel.swapSlot === i ? null : i; }
  else if(el = g('honey')) sel.honey = el.dataset.honey;
  else return;
  renderBuilder();
};
$('builder').addEventListener('input', e => { if(e.target.id === 'note') sel.note = e.target.value; });

$('btnAdd').onclick = () => {
  const m = curMenu(); if(!m) return;
  const P = priceSel();
  const item = {menu:m.id, name:m.name, sizeName:P.sizeName, tops:P.tops, honey:sel.honey, note:sel.note.trim(), unit:P.unit, qty:1};
  item.key = JSON.stringify([item.menu, item.sizeName, item.tops.map(t => [t.name, t.n, t.removed ? 1 : 0, t.from]), item.honey, item.note]);
  const found = cart.find(i => i.key === item.key);
  if(found) found.qty++; else cart.push(item);
  resetSel(); renderBuilder(); renderCart(); toast('เพิ่มแล้ว ✓');
};
</script>
<script>
/* ===== js/ui/cart.js ===== */
/* ---------- Cart ---------- */
let cart = [];
const cartTotal = () => cart.reduce((s, i) => s + i.unit * i.qty, 0);

function renderCart(){
  if(!cart.length) $('cart').innerHTML = '<div class="empty">ยังไม่มีรายการ<br>เลือกเมนูได้เลย</div>';
  else $('cart').innerHTML = cart.map((i, idx) => `
    <div class="line">
      <div class="t"><span>${esc(itemTitle(i))}</span><span>${baht(i.unit * i.qty)}</span></div>
      <div class="d">${itemLines(i).map(esc).join('<br>')}</div>
      <div class="qty">
        <button data-m="${idx}">−</button><b>${i.qty}</b><button data-p="${idx}">+</button>
        <button class="rm" data-r="${idx}">ลบ</button>
      </div>
    </div>`).join('');
  const t = cartTotal(), n = cart.reduce((s, i) => s + i.qty, 0);
  $('total').textContent = baht(t); $('barTotal').textContent = baht(t); $('barCount').textContent = n + ' รายการ';
  $('btnPay').disabled = $('btnPay2').disabled = !cart.length;
  $('btnClear').disabled = !cart.length;
}
$('cart').onclick = e => {
  const g = a => e.target.closest(`[data-${a}]`); let el;
  if(el = g('p')) cart[el.dataset.p].qty++;
  else if(el = g('m')){ const i = cart[el.dataset.m]; i.qty--; if(i.qty <= 0) cart.splice(el.dataset.m, 1); }
  else if(el = g('r')) cart.splice(el.dataset.r, 1);
  else return;
  renderCart();
};
$('btnClear').onclick = () => {
  if(!cart.length) return;
  askConfirm({msg:'ล้างออเดอร์ทั้งหมด?', yes:'ล้างออเดอร์', onYes:() => { cart = []; resetSel(); renderBuilder(); renderCart(); toast('ล้างออเดอร์แล้ว'); }});
};
</script>
<script>
/* ===== js/ui/pay.js ===== */
/* ---------- Payment ---------- */
let pay = {dining:null, method:'cash', received:0}, lastSale = null;
function openPay(){ if(!cart.length) return; pay = {dining:null, method:'cash', received:0}; renderPay(); }
function renderPay(){
  const total = cartTotal(), change = pay.received - total;
  const cashOk = pay.method !== 'cash' || pay.received >= total;
  const ok = !!pay.dining && cashOk;
  const hadFocus = document.activeElement && document.activeElement.id === 'recv';
  let h = `<h3>ชำระเงิน · ${baht(total)}</h3>
    <div class="q2">รับที่ร้านหรือกลับบ้าน?</div>
    <div class="row">${CONFIG.dining.map(d => `<button class="opt ${pay.dining === d.id ? 'on':''}" data-dine="${d.id}">${d.icon} ${d.name}</button>`).join('')}</div>
    <div class="q2">วิธีชำระเงิน</div>
    <div class="row wrap">${CONFIG.methods.map(x => `<button class="opt ${pay.method === x.id ? 'on':''}" data-method="${x.id}">${x.icon} ${x.name}</button>`).join('')}</div>`;
  if(pay.method === 'cash'){
    h += `<div class="quick"><button data-q="${total}">พอดี</button>${[20,50,100,500,1000].map(v => `<button data-q="${v}">${v}</button>`).join('')}</div>
      <input class="num" id="recv" inputmode="numeric" placeholder="รับเงินมา" value="${pay.received || ''}">
      <div class="change">${pay.received ? (change >= 0 ? 'เงินทอน ' + baht(change) : '<span style="color:var(--bad)">ยังขาด ' + baht(-change) + '</span>') : '&nbsp;'}</div>`;
  } else {
    h += `<p style="color:var(--mute);margin:14px 0">ตรวจสอบว่ายอด <b>${baht(total)}</b> ผ่านเรียบร้อย (${esc(METHOD[pay.method].name)}) แล้วจึงกดยืนยัน</p>`;
  }
  h += `<div class="row"><button class="ghost" id="payCancel">ยกเลิก</button>
    <button class="pay" id="payOk" ${ok ? '' : 'disabled'}>${ok ? 'ยืนยันการชำระเงิน' : (!pay.dining ? 'เลือกกินเลย / กลับบ้านก่อน' : 'รับเงินยังไม่ครบ')}</button></div>`;
  openModal(h);
  const r = $('recv');
  if(r){
    r.oninput = () => { pay.received = Number(r.value.replace(/\D/g, '')) || 0; renderPay(); const n = $('recv'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    if(hadFocus){ r.focus(); r.setSelectionRange(r.value.length, r.value.length); }
  }
}
function confirmPay(){
  if(!pay.dining || STORE_MODE === 'loading') return;
  const total = cartTotal(), now = new Date(), sales = loadSales(), biz = bizDate(now);
  const no = (sales.filter(s => s.date === biz).length % 999) + 1;
  const sale = {
    id: now.getTime(), no, date: biz, ts: now.toISOString(), dining: pay.dining,
    items: cart.map(i => ({menu:i.menu, name:i.name, sizeName:i.sizeName, tops:i.tops, honey:i.honey, note:i.note, unit:i.unit, qty:i.qty})),
    total, method: pay.method, received: pay.method === 'cash' ? pay.received : total,
    change: pay.method === 'cash' ? pay.received - total : 0, void:false
  };
  sales.push(sale);
  if(!saveSales(sales)) return;
  lastSale = sale; cart = []; renderCart(); updateNext();
  openModal(`<div class="big">✅</div>
    <h3 style="text-align:center">ออเดอร์ #${pad(no, 3)} · ${DINE[sale.dining].name}</h3>
    ${sale.method === 'cash' ? `<div class="change">เงินทอน ${baht(sale.change)}</div>` : `<div class="change" style="color:var(--blue)">ชำระด้วย ${esc(METHOD[sale.method].name)} แล้ว</div>`}
    <div class="row"><button class="ghost" id="prRec">🧾 ใบเสร็จ</button><button class="ghost" id="prKit">🍳 ตั๋วครัว</button><button class="ghost" id="prBoth">🖨️ พิมพ์ทั้งสอง</button></div>
    <button class="pay" id="nextOrder">ออเดอร์ถัดไป</button>`);
  if(CONFIG.autoPrint) printSale(sale, 'both');
}
$('btnPay').onclick = $('btnPay2').onclick = openPay;
</script>
<script>
/* ===== js/ui/summary.js ===== */
/* ---------- Summary (PIN) ---------- */
$('btnSummary').onclick = () => askPin(() => { const r = defaultRound(); REP.from = REP.to = r.date; REP.fb = r.fallback; REP.tab = 'items'; renderSummary(); });

let repCsv = null;

const shareCell = p => `${p}%<div class="share"><i style="width:${Math.min(100, p)}%"></i></div>`;
function tbl(head, rows, foot){
  const c = (cells, tag) => cells.map((x, i) => `<${tag} class="${head[i][1] ? 'n' : ''}">${x}</${tag}>`).join('');
  return `<table><tr>${c(head.map(h => h[0]), 'th')}</tr>${rows.map(r => `<tr>${c(r, 'td')}</tr>`).join('')}${foot ? `<tr class="tot">${c(foot, 'td')}</tr>` : ''}</table>`;
}
const EMPTY = '<p class="note2" style="padding:14px 0">ยังไม่มีข้อมูลในช่วงนี้</p>';

function tabItems(R){
  const mi = id => CONFIG.menus.findIndex(m => m.id === id);
  const rows = Object.values(R.items).sort((a, b) => mi(a.menu) - mi(b.menu) || a.name.localeCompare(b.name, 'th'));
  if(!rows.length) return {html:EMPTY, csv:[]};
  const byMenu = {};
  rows.forEach(r => { const b = byMenu[r.menu] || (byMenu[r.menu] = {name: MENU[r.menu] ? MENU[r.menu].name : r.menu, qty:0, rev:0}); b.qty += r.qty; b.rev += r.rev; });
  const H = [['รายการ'], ['จำนวน (แก้ว)', 1], ['ยอดขาย', 1], ['สัดส่วนยอดขาย']];
  const line = r => [esc(r.name), r.qty, baht(r.rev), shareCell(pct(r.rev, R.total))];
  return {
    html: `<div class="sec2">ตามเมนูหลัก</div>` + tbl(H, Object.values(byMenu).map(line), ['รวม', R.cups, baht(R.total), '']) +
          `<div class="sec2">ตามรายการ <small>(แยกขนาด)</small></div>` + tbl(H, rows.map(line)),
    csv: [['รายการ','จำนวน (แก้ว)','ยอดขาย','สัดส่วนยอดขาย %']].concat(rows.map(r => [r.name, r.qty, r.rev, pct(r.rev, R.total)]))
  };
}
function tabPay(R){
  if(!R.bills) return {html:EMPTY, csv:[]};
  const H = [['ช่องทางชำระเงิน'], ['จำนวนบิล', 1], ['ยอดขาย', 1], ['เฉลี่ย/บิล', 1], ['สัดส่วนยอดขาย']];
  const rows = CONFIG.methods.map(m => { const v = R.methods[m.id]; return [`${m.icon} ${esc(m.name)}`, v.bills, baht(v.rev), v.bills ? baht(Math.round(v.rev / v.bills)) : '–', shareCell(pct(v.rev, R.total))]; });
  return {
    html: tbl(H, rows, ['รวม', R.bills, baht(R.total), baht(Math.round(R.total / R.bills)), '']) +
          `<p class="note2">เงินสดที่ควรมีในลิ้นชัก (ไม่รวมเงินทอนตั้งต้น) = ${baht(R.methods.cash ? R.methods.cash.rev : 0)}</p>`,
    csv: [['ช่องทางชำระเงิน','จำนวนบิล','ยอดขาย','เฉลี่ย/บิล','สัดส่วนยอดขาย %']].concat(CONFIG.methods.map(m => { const v = R.methods[m.id]; return [m.name, v.bills, v.rev, v.bills ? Math.round(v.rev / v.bills) : 0, pct(v.rev, R.total)]; }))
  };
}
function tabOpts(R){
  const order = {
    'ขนาด': CONFIG.menus.filter(m => m.sizes).flatMap(m => m.sizes.map(z => z.name + (z.noTop ? ' · ไม่มีท็อปปิ้ง' : ''))),
    'น้ำผึ้ง': CONFIG.honey.map(h => h.name),
    'กินเลย / กลับบ้าน': CONFIG.dining.map(d => d.name),
  };
  const notes = {
    'ขนาด': 'ยอดขาย = ยอดรวมของแก้วที่เลือกขนาดนี้',
    'น้ำผึ้ง': 'ยอดขาย = ยอดรวมของแก้วที่เลือกระดับน้ำผึ้งนี้ (น้ำผึ้งไม่คิดเงินเพิ่ม)',
    'กินเลย / กลับบ้าน': 'นับเป็นบิล · ยอดขาย = ยอดรวมของบิล',
    'ท็อปปิ้งที่คิดเงินเพิ่ม': 'ยอดขาย = เฉพาะเงินที่คิดเพิ่มจากท็อปปิ้ง (Extra และชิ้นที่เกินโควตาฟรี)',
    'การปรับท็อปปิ้ง': 'Acai / Banana Choco ที่เปลี่ยนหรือไม่รับท็อปปิ้ง · ไม่คิดเงินเพิ่ม',
  };
  let html = '', csv = [['กลุ่มตัวเลือก','ตัวเลือก','หน่วย','จำนวน','ยอดขาย']];
  Object.keys(notes).forEach(g => {
    const G = R.groups[g]; if(!G) return;
    const rows = Object.entries(G.rows).map(([o, v]) => ({o, ...v}));
    const ord = order[g];
    rows.sort((a, b) => ord ? ((ord.indexOf(a.o) + 1 || 999) - (ord.indexOf(b.o) + 1 || 999)) : (b.qty - a.qty));
    const tq = rows.reduce((a, r) => a + r.qty, 0), noRev = g === 'การปรับท็อปปิ้ง';
    html += `<div class="sec2">${esc(g)} <small>· หน่วย: ${G.unit}</small></div>` +
      tbl([['ตัวเลือก'], ['จำนวน', 1], ['ยอดขาย', 1], ['สัดส่วนจำนวน']],
          rows.map(r => [esc(r.o), r.qty, noRev ? '–' : baht(r.rev), shareCell(pct(r.qty, tq))])) +
      `<p class="note2">${notes[g]}</p>`;
    rows.forEach(r => csv.push([g, r.o, G.unit, r.qty, noRev ? 0 : r.rev]));
  });
  if(!html) return {html:EMPTY, csv:[]};
  return {html: html + '<p class="note2">แต่ละกลุ่มนับแยกกัน ไม่ควรนำยอดขายระหว่างกลุ่มมารวมกัน</p>', csv};
}
function tabIngr(R){
  const secs = [['base','Base (ฐาน)'], ['dried','Dried'], ['fruit','Fruits'], ['sauce','Sauce'], ['honey','น้ำผึ้ง'], ['other','อื่นๆ']];
  let html = '', csv = [['หมวด','วัตถุดิบ','จำนวน']];
  secs.forEach(([k, label]) => {
    const rows = Object.values(R.ingr).filter(x => x.sec === k).sort((a, b) => b.qty - a.qty);
    if(!rows.length) return;
    html += `<div class="sec2">${label}</div>` + tbl([['วัตถุดิบ'], ['จำนวน', 1]], rows.map(r => [esc(r.name), r.qty]));
    rows.forEach(r => csv.push([label, r.name, r.qty]));
  });
  if(!html) return {html:EMPTY, csv:[]};
  return {html: html + '<p class="note2">นับเป็นจำนวนส่วนที่เสิร์ฟให้ลูกค้า (ไม่รวมท็อปปิ้งที่ลูกค้า "ไม่รับ") ยังไม่ใช่น้ำหนักกรัม · น้ำผึ้งแบบ "ไม่รับ" ไม่นับ</p>', csv};
}
function tabBills(R){
  const list = R.all.slice().sort((a, b) => b.ts.localeCompare(a.ts));
  const multi = REP.from !== REP.to;
  const rows = list.map(x => {
    const t = new Date(x.ts);
    return `<tr class="${x.void ? 'void' : ''}"><td>${multi ? x.date + '<br>' : ''}#${pad(x.no, 3)}<br><small>${pad(t.getHours())}:${pad(t.getMinutes())}</small></td>
      <td>${x.items.map(i => `${esc(itemTitle(i))} ×${i.qty}`).join('<br>')}<br><small>${esc(DINE[x.dining].name)}</small></td>
      <td>${baht(x.total)}<br><small>${esc(METHOD[x.method].name)}</small></td>
      <td><button class="sbtn" data-prr="${x.id}">ใบเสร็จ</button><button class="sbtn" data-prk="${x.id}">ตั๋วครัว</button>${x.void ? `<br><small style="color:var(--bad)">ยกเลิกแล้ว</small> <button class="rbtn" data-restore="${x.id}">↩︎ นำกลับ</button>` : `<button class="vbtn" data-v="${x.id}">ยกเลิกบิล</button>`}${(x.log || []).length ? `<br><small style="color:var(--mute)">${esc(historyText(x))}</small>` : ''}</td></tr>`;
  }).join('');
  return {
    html: list.length ? `<table><tr><th>บิล</th><th>รายการ</th><th>ยอด</th><th></th></tr>${rows}</table>` : EMPTY,
    csv: billsCsvRows(list), extra: '<button class="ghost" id="csvAll">⬇️ สำรองข้อมูลทั้งหมด</button>'
  };
}

function renderSummary(){
  if(!REP.from){ const r = defaultRound(); REP.from = REP.to = r.date; REP.fb = r.fallback; }
  const R = buildReport(REP.from, REP.to);
  const tabs = [['items','🍧 สินค้า'], ['pay','💳 ชำระเงิน'], ['opts','🧩 ตัวเลือก'], ['ingr','🥣 วัตถุดิบ'], ['bills','🧾 บิล']];
  const T = {items:tabItems, pay:tabPay, opts:tabOpts, ingr:tabIngr, bills:tabBills}[REP.tab](R);
  repCsv = {name: `geek-popup-${REP.tab}-${REP.from}_${REP.to}.csv`, rows: T.csv};
  openModal(`
    <h3>📊 สรุปยอดขาย</h3>
    <div class="rangebar">
      <input type="date" id="repFrom" value="${REP.from}"><span>ถึง</span><input type="date" id="repTo" value="${REP.to}">
      <button class="chip" data-range="today">วันนี้</button><button class="chip" data-range="yday">เมื่อวาน</button>
      <button class="chip" data-range="7d">7 วัน</button><button class="chip" data-range="all">ทั้งหมด</button>
    </div>
    <div class="note2"><b>${roundLabel(REP.from, REP.to)}</b>${R.voided ? ` · ไม่นับบิลที่ยกเลิก ${R.voided} บิล` : ''}</div>
    ${REP.fb ? `<div class="note2" style="color:var(--orange)">รอบปัจจุบันยังไม่มีบิล จึงแสดงรอบล่าสุดที่มีการขาย</div>` : ''}
    <div class="stats">
      <div class="stat"><small>ยอดขายรวม</small><b>${baht(R.total)}</b></div>
      <div class="stat"><small>จำนวนบิล</small><b>${R.bills}</b></div>
      <div class="stat"><small>จำนวนแก้ว</small><b>${R.cups}</b></div>
      <div class="stat"><small>เฉลี่ยต่อบิล</small><b>${R.bills ? baht(Math.round(R.total / R.bills)) : '–'}</b></div>
    </div>
    <div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${REP.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
    ${T.html}
    <div class="row" style="margin-top:16px">
      ${T.csv.length ? '<button class="ghost" id="csvTab">⬇️ ดาวน์โหลด CSV (แท็บนี้)</button>' : ''}${T.extra || ''}
      <button class="pay" id="closeX">ปิด</button>
    </div>
    <p class="note2">ข้อมูลเก็บในเครื่องนี้เท่านั้น แนะนำดาวน์โหลด CSV สำรองทุกวันก่อนปิดร้าน</p>`, true);
  $('repFrom').onchange = e => { if(e.target.value){ REP.fb = false; REP.from = e.target.value; if(REP.to < REP.from) REP.to = REP.from; renderSummary(); } };
  $('repTo').onchange = e => { if(e.target.value){ REP.fb = false; REP.to = e.target.value; if(REP.from > REP.to) REP.from = REP.to; renderSummary(); } };
}
let csvPending = null;

/* เปิดหน้าต่างส่งออกแทนการดาวน์โหลดทันที เพื่อไม่ให้หน้า POS ถูกเปลี่ยนเป็นหน้าว่าง (จอขาว) */
function downloadCsv(filename, rows, back){
  csvPending = {filename, text: csvText(rows), back: back || null};
  const canShare = !!(navigator.canShare && window.File && (() => { try{ return navigator.canShare({files:[new File(['x'], 'a.csv', {type:'text/csv'})]}); }catch(e){ return false; } })());
  openModal(`<h3>⬇️ ส่งออก CSV</h3>
    <p class="note2" style="margin-top:0">${esc(filename)} · ${rows.length - 1} แถว</p>
    <div class="row wrap">
      <button class="opt" id="csvDl">💾 ดาวน์โหลดไฟล์</button>
      ${canShare ? '<button class="opt" id="csvShare">📤 แชร์ / บันทึกลง Files</button>' : ''}
      <button class="opt" id="csvCopy">📋 คัดลอกข้อความ</button>
    </div>
    <p class="note2">ถ้ากดดาวน์โหลดแล้วไม่มีไฟล์ (เช่นบน iPad) ให้ใช้ "แชร์ / บันทึกลง Files" หรือ "คัดลอก" แล้ววางใน Google Sheets / Excel</p>
    <textarea class="csvbox" id="csvText" readonly></textarea>
    <div class="row"><button class="pay" id="csvBack">${back ? 'กลับไปหน้าสรุป' : 'ปิด'}</button></div>`);
  $('csvText').value = csvPending.text;
}
function csvDownload(){
  const c = csvPending; if(!c) return;
  try{
    const url = URL.createObjectURL(new Blob(['﻿' + c.text], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = c.filename; a.target = '_blank'; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
    toast('กำลังดาวน์โหลด…');
  }catch(e){ toast('ดาวน์โหลดไม่ได้ ลองใช้ "คัดลอก" แทน'); }
}
async function csvShare(){
  const c = csvPending; if(!c) return;
  try{ await navigator.share({files:[new File(['﻿' + c.text], c.filename, {type:'text/csv'})], title:c.filename}); }
  catch(e){ if(e && e.name !== 'AbortError') toast('แชร์ไม่สำเร็จ ลองใช้ "คัดลอก" แทน'); }
}
async function csvCopy(){
  const c = csvPending; if(!c) return;
  try{ await navigator.clipboard.writeText(c.text); toast('คัดลอกแล้ว ✓'); }
  catch(e){ const t = $('csvText'); t.focus(); t.select(); try{ document.execCommand('copy'); toast('คัดลอกแล้ว ✓'); }catch(_){ toast('กดค้างที่ข้อความแล้วเลือกคัดลอก'); } }
}
function billsCsvRows(list){
  const rows = [['วันที่รอบขาย','เวลา','บิล','รับประทาน','รายการ','ยอดรวม','วิธีจ่าย','สถานะ','ประวัติ']];
  list.forEach(s => {
    const t = new Date(s.ts);
    rows.push([s.date, `${pad(t.getHours())}:${pad(t.getMinutes())}`, pad(s.no, 3), DINE[s.dining].name,
      s.items.map(i => `${itemTitle(i)} x${i.qty} [${itemLines(i).join(' | ')}]`).join(' ; '),
      s.total, METHOD[s.method].name, s.void ? 'ยกเลิก' : 'ปกติ', historyText(s)]);
  });
  return rows;
}

function exportCsv(){ downloadCsv(`geek-popup-sales-all-${dateKey(new Date())}.csv`, billsCsvRows(loadSales()), true); }
</script>
<script>
/* ===== demo-seed.js ===== */
/* ---------- DEMO: ข้อมูลตัวอย่าง 3 รอบขายล่าสุด สร้างใหม่อัตโนมัติเมื่อข้อมูลเก่า (เก็บแยกจากตัวจริง) ---------- */
function seedDemo(force){
  const cur = bizDate(new Date()), SEEDKEY = KEY + '_for';
  let seededFor = null; try{ seededFor = localStorage.getItem(SEEDKEY); }catch(e){}
  if(!force && seededFor === cur && loadSales().length) return;
  let seed = 20261005; const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const freeNames = CONFIG.items.filter(i => i.price === 0).map(i => i.name), extraNames = CONFIG.items.filter(i => i.price > 0).map(i => i.name);
  const swapPool = {dried:['Almonds','Chia','Cacao nibs','Granola'], fruit:['Mango','Kiwi'], sauce:['Caramel','Hazelnut spread']};
  const sales = [], now = new Date();
  /* รอบขาย D = (D-1) 23:00 ถึง D 22:59 · ขายจริงช่วง 10:00–21:00 ของวัน D
     ถ้าตอนนี้เลย 23:00 ไปแล้ว รอบปัจจุบันยังไม่เริ่มขาย จึงสร้างให้ 3 รอบก่อนหน้า */
  const lastFull = addDays(cur, now.getHours() >= CONFIG.resetHour ? -1 : 0);
  [2, 1, 0].forEach(back => {
    const D = addDays(lastFull, -back), [y, m, d] = D.split('-').map(Number);
    const n = 14 + Math.floor(rnd() * 8); let no = 0;
    for(let k = 0; k < n; k++){
      const when = new Date(y, m - 1, d, 10 + Math.floor(k * 11 / n), Math.floor(rnd() * 60));
      if(when > now) break;
      const items = [];
      for(let q = rnd() < .25 ? 2 : 1; q > 0; q--){
        const r = rnd(), id = r < .55 ? 'greek' : r < .8 ? 'acai' : 'banana', mm = MENU[id];
        resetSel(); pickMenu(id);
        if(id === 'greek'){
          sel.size = pick(['g1n','g1','g1','g2','g2']);
          if(sel.size !== 'g1n') for(let t = 1 + Math.floor(rnd() * 4); t > 0; t--) sel.picks.push(rnd() < .2 ? pick(extraNames) : (rnd() < .3 && sel.picks.length ? sel.picks[0] : pick(freeNames)));
        } else {
          mm.defaults.forEach((dd, i) => { const x = rnd(); if(x < .08) sel.comps[i] = null; else if(x < .18){ const c = pick(swapPool[ITEM[dd].cat].filter(z => !(mm.noSwap || []).includes(z))); if(!sel.comps.includes(c)) sel.comps[i] = c; } });
        }
        sel.honey = pick(['normal','normal','normal','lots','little','side','none']);
        const P = priceSel();
        items.push({menu:mm.id, name:mm.name, sizeName:P.sizeName, tops:P.tops, honey:sel.honey, note:'', unit:P.unit, qty:1});
      }
      resetSel();
      const total = items.reduce((a, i) => a + i.unit * i.qty, 0), method = pick(['cash','cash','promptpay','promptpay','promptpay','tcp']);
      const sale = {id: when.getTime() + k, no: ++no, date: D, ts: when.toISOString(), dining: pick(['dinein','dinein','takeaway']), items, total, method,
        received: method === 'cash' ? Math.ceil(total / 100) * 100 : total, change: 0, void: false};
      sale.change = sale.received - total;
      if(back === 1 && k === 3){ sale.void = true; sale.voidAt = new Date(when.getTime() + 120000).toISOString(); sale.log = [{act:'void', at:sale.voidAt}]; }
      sales.push(sale);
    }
  });
  clearSales(); saveSales(sales);
  try{ localStorage.setItem(SEEDKEY, cur); }catch(e){}
}
storeReady.then(() => seedDemo(false));
$('btnReseed').onclick = () => askConfirm({msg:'สร้างข้อมูลตัวอย่างใหม่?', sub:'บิลใน DEMO ทั้งหมดจะถูกแทนที่', yes:'สร้างใหม่', ok:true, onYes:() => { seedDemo(true); updateNext(); toast('สร้างข้อมูลตัวอย่างแล้ว ✓'); }});
</script>
<script>
/* ===== js/ui/main.js ===== */
/* ---------- เลขออเดอร์ถัดไป + ตัวจัดการคลิกใน modal + เริ่มต้นหน้าจอ (ไฟล์สุดท้าย) ---------- */
function updateNext(){ $('nextNo').textContent = 'ออเดอร์ถัดไป #' + pad(nextNo(), 3); }

/* ---------- Modal click handler (ชำระเงิน / สรุปยอด / พิมพ์) ---------- */
$('modal').onclick = e => {
  const g = a => e.target.closest(`[data-${a}]`); let el;
  if(el = g('dine')){ pay.dining = el.dataset.dine; renderPay(); return; }
  if(el = g('method')){ pay.method = el.dataset.method; if(pay.method !== 'cash') pay.received = 0; renderPay(); return; }
  if(el = g('q')){ pay.received = Number(el.dataset.q); renderPay(); return; }
  if(el = g('v') || g('restore')){
    const isVoid = !!el.dataset.v, sid = isVoid ? el.dataset.v : el.dataset.restore;
    const sv = loadSales().find(x => String(x.id) === sid); if(!sv) return;
    askConfirm(isVoid
      ? {msg:`ยกเลิกบิล #${pad(sv.no, 3)}?`, sub:'ระบบจะเก็บประวัติไว้ และนำกลับมาได้ภายหลัง', yes:'ยกเลิกบิล'}
      : {msg:`นำบิล #${pad(sv.no, 3)} กลับมา?`, sub:`ยอด ${baht(sv.total)} จะถูกนับในยอดขายอีกครั้ง`, yes:'นำกลับ', ok:true});
    confirmCb = () => {
      const all = loadSales(), x = all.find(y => String(y.id) === sid);
      if(x){ const at = new Date().toISOString(); x.void = isVoid; (x.log = x.log || []).push({act: isVoid ? 'void' : 'restore', at}); if(isVoid) x.voidAt = at; else delete x.voidAt; saveSales(all); toast(isVoid ? 'ยกเลิกบิลแล้ว' : 'นำบิลกลับแล้ว ✓'); }
      renderSummary();
    };
    confirmNo = renderSummary;
    return;
  }
  if(el = g('prr')){ const s = loadSales().find(x => String(x.id) === el.dataset.prr); if(s) printSale(s, 'receipt'); return; }
  if(el = g('prk')){ const s = loadSales().find(x => String(x.id) === el.dataset.prk); if(s) printSale(s, 'kitchen'); return; }
  if(el = g('tab')){ REP.tab = el.dataset.tab; renderSummary(); return; }
  if(el = g('range')){ setRange(el.dataset.range); renderSummary(); return; }
  const b = e.target.closest('button'); const id = b && b.id;
  if(id === 'payCancel' || id === 'closeX' || id === 'nextOrder' || id === 'pinNo') closeModal();
  else if(id === 'cfYes'){ const cb = confirmCb; confirmCb = confirmNo = null; closeModal(); if(cb) cb(); }
  else if(id === 'cfNo'){ const cb = confirmNo; confirmCb = confirmNo = null; closeModal(); if(cb) cb(); }
  else if(id === 'pinOk') checkPin();
  else if(id === 'csvTab'){ if(repCsv) downloadCsv(repCsv.name, repCsv.rows, true); }
  else if(id === 'csvDl') csvDownload();
  else if(id === 'csvShare') csvShare();
  else if(id === 'csvCopy') csvCopy();
  else if(id === 'csvBack'){ const b = csvPending && csvPending.back; csvPending = null; if(b) renderSummary(); else closeModal(); }
  else if(id === 'csvAll') exportCsv();
  else if(id === 'payOk') confirmPay();
  else if(id === 'prRec' && lastSale) printSale(lastSale, 'receipt');
  else if(id === 'prKit' && lastSale) printSale(lastSale, 'kitchen');
  else if(id === 'prBoth' && lastSale) printSale(lastSale, 'both');
};

/* ---------- Init ---------- */
$('pageStyle').textContent = '@page{size:' + CONFIG.paperMm + 'mm auto;margin:0}';
document.documentElement.style.setProperty('--paper', CONFIG.paperMm + 'mm');
renderBuilder(); renderCart();
storeReady.then(updateNext);   // เลขออเดอร์ต้องรอโหลดบิลจาก IndexedDB ก่อน
/* PWA: ใช้งานออฟไลน์ได้ (ต้องเปิดผ่าน https หรือ localhost · ต้นแบบไฟล์เดียวไม่มี manifest จึงข้าม) */
if('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker', e));
</script>
