      : t.add ? {text:`  + เพิ่ม ${topName(t.name)}${t.n > 1 ? ` ×${t.n}` : ''}`, bold:true}
      : {text:`  - ${topName(t.name)}${t.n > 1 ? ` ×${t.n}` : ''}${t.from ? ` (เปลี่ยนจาก ${topName(t.from)})` : ''}${t.extra ? ` (+${t.extra})` : ''}`, bold:t.n > 1 || !!t.from}));
    else if(i.menu === 'greek') b.push({text:'  - ไม่มีท็อปปิ้ง'});
    if(i.fewTops !== undefined) b.push({text:`  ** ${i.fewTops ? `ลูกค้าเลือก ${i.fewTops} อย่าง` : 'ลูกค้าไม่เอาท็อปปิ้งฟรี'} · ตักปริมาณปกติ **`, bold:true});
    if(i.honey !== undefined) b.push({text:`  น้ำผึ้ง: ${HONEY[i.honey].name}`, bold:true});
    if(i.note) b.push({text:`  หมายเหตุ: ${i.note}`, bold:true});
  });
  return b;
}
/* บิล → byte ESC/POS: แต่ละใบวาดเป็นภาพ (ภาษาไทยไม่พึ่งฟอนต์ปริ้นเตอร์) แล้วตัดกระดาษ */
function slipBytes(blockSets){
  const parts = [ESCPOS.init()];
  blockSets.forEach(bl => parts.push(canvasCmds(renderSlip(bl)), ESCPOS.cut()));
  return bytes(...parts);
}

/* ---------- พิมพ์: ปริ้นเตอร์ USB ถ้าเชื่อมอยู่ ไม่งั้นใช้หน้าพิมพ์ของระบบ (window.print) ---------- */
const usbPrinter = UsbPrinter.supported() ? new UsbPrinter() : null;
let printQueue = Promise.resolve();   // ส่งทีละงาน กันข้อมูลสองบิลปนกันเมื่อกดพิมพ์ซ้ำเร็วๆ
function printSale(s, which){
  const sets = [];
  if(which !== 'kitchen') sets.push(receiptBlocks(s));
  if(which !== 'receipt') sets.push(kitchenBlocks(s));
  return printSlips(sets, () => printHtml(s, which));
}
function printSlips(sets, fallback){
  if(!usbPrinter || !usbPrinter.connected){ if(fallback) fallback(); return Promise.resolve(false); }
  return printQueue = printQueue.then(() => usbPrinter.send(slipBytes(sets))).then(() => true, e => {
    console.warn('usb print', e);
    usbPrinter.forget(); renderPrinterBtn();
    toast('ส่งไปปริ้นเตอร์ไม่ได้ เช็กสายแล้วกดเชื่อมใหม่', 'alert');
    if(fallback) fallback();
    return false;
  });
}
function printHtml(s, which){
  let h = '';
  if(which !== 'kitchen') h += receiptHtml(s);
  if(which !== 'receipt') h += kitchenHtml(s);
  $('printArea').innerHTML = h;
  setTimeout(() => window.print(), 80);
}

/* ---------- ปุ่มปริ้นเตอร์บนแถบหัว (แสดงเฉพาะเบราว์เซอร์ที่มี WebUSB เช่น Chrome บน Android) ---------- */
function renderPrinterBtn(){
  const b = $('btnPrinter'); if(!b) return;
  if(!usbPrinter){ b.style.display = 'none'; return; }
  const ok = usbPrinter.connected;
  b.classList.toggle('off', !ok);
  b.innerHTML = icon('printer', 18) + (ok ? ' ปริ้นเตอร์พร้อม' : ' เชื่อมปริ้นเตอร์');
}
async function connectPrinter(){
  try{ await usbPrinter.request(); renderPrinterBtn(); toast('เชื่อมปริ้นเตอร์แล้ว', 'check'); }
  catch(e){
    renderPrinterBtn();
    if(e && e.name === 'NotFoundError') return;   // กดยกเลิกในหน้าต่างเลือกอุปกรณ์
    console.warn('usb connect', e);
    toast('เชื่อมปริ้นเตอร์ไม่สำเร็จ ลองถอดสายแล้วเสียบใหม่', 'alert');
  }
}
function openPrinterInfo(){
  const d = usbPrinter.dev;
  openModal(`<h3>${icon('printer', 22)} ปริ้นเตอร์</h3>
    <p style="margin:0 0 6px"><b>เชื่อมอยู่:</b> ${esc((d && d.productName) || 'ปริ้นเตอร์ USB')}</p>
    <p style="color:var(--mute);margin:0 0 6px">ใบเสร็จและตั๋วครัวจะพิมพ์ออกเครื่องนี้ทันทีหลังชำระเงิน</p>
    <div class="row"><button class="ghost" id="prOff">ยกเลิกการเชื่อม</button><button class="pay" id="prTest">พิมพ์ทดสอบ</button></div>
    <button class="linkbtn" id="closeX">ปิด</button>`);
}
function printTest(){
  closeModal();
  printSlips([[{text:CONFIG.shopName, size:32, bold:true, align:'center'}, {text:'ทดสอบปริ้นเตอร์', size:40, bold:true, align:'center', invert:true},
    {text:fmtDT(new Date().toISOString()), align:'center'}, {rule:'dash'}, {text:'ภาษาไทย: กี่ ปู่ ญี่ปุ่น ปั๊ม น้ำ ๑๒๓', align:'center'}]])
    .then(ok => { if(ok) toast('ส่งงานพิมพ์แล้ว', 'check'); });
}
async function disconnectPrinter(){ closeModal(); try{ await usbPrinter.close(); }catch(e){ usbPrinter.forget(); } renderPrinterBtn(); }

if(usbPrinter){
  $('btnPrinter').onclick = () => usbPrinter.connected ? openPrinterInfo() : connectPrinter();
  /* เครื่องที่เคยอนุญาตแล้ว: เชื่อมเองตอนเปิดแอปและตอนเสียบสายใหม่ พนักงานไม่ต้องกดอะไร */
  const auto = () => { if(!usbPrinter.connected) usbPrinter.reconnect().then(renderPrinterBtn, e => { console.warn('usb reconnect', e); renderPrinterBtn(); }); };
  navigator.usb.addEventListener('connect', auto);
  navigator.usb.addEventListener('disconnect', e => {
    if(e.device !== usbPrinter.dev) return;
    usbPrinter.forget(); renderPrinterBtn(); toast('ปริ้นเตอร์หลุด เสียบสายใหม่แล้วจะเชื่อมเอง', 'alert');
  });
  auto();
}
renderPrinterBtn();
</script>
<script>
/* ===== js/ui/builder.js ===== */
/* ---------- Builder state ---------- */
let sel;
function resetSel(){ sel = {menu:null, size:null, picks:[], comps:[], swapSlot:null, honey:CONFIG.honeyDefault, sep:false, adds:[], addOpen:false, note:''}; }
resetSel();
const curMenu = () => sel.menu ? MENU[sel.menu] : null;
/* น้ำผึ้งไม่มีค่าเริ่มต้น ต้องเลือกก่อนเพิ่มลงออเดอร์ (ยกเว้นเมนูที่ไม่มีน้ำผึ้ง) */
const needHoney = () => { const m = curMenu(); return !!m && !m.noHoney && !sel.honey; };

function pickMenu(id){
  if(sel.menu === id) return;
  const m = MENU[id];
  sel = {menu:id, size:m.sizes ? 'g1' : null, picks:[], comps:m.defaults ? [...m.defaults] : [], swapSlot:null, honey:CONFIG.honeyDefault, sep:false, adds:[], addOpen:false, note:''};
}

function sec(n, title, body, right=''){ return `<div class="sec"><p class="step"><b>${n}</b> ${title}${right}</p>${body}</div>`; }

/* ตัวนับโควตาฟรี + ป้ายส้ม "คิดเพิ่ม" รวมทุกชิ้นที่คิดเงิน (กลุ่มฟรีที่เกินโควตา + กลุ่ม Extra) = ยอดที่พนักงานบอกลูกค้า */
function topCounter(P){
  if(P.perTop){ const pcs = P.tops.reduce((a, t) => a + t.n, 0), money = P.tops.reduce((a, t) => a + t.extra, 0);
    return `<span class="cnts"><span class="cnt">ชิ้นละ ${P.perTop}</span>${pcs ? `<span class="cnt over">${pcs} ชิ้น +${baht(money)}</span>` : ''}</span>`; }
  const q = CONFIG.freeToppingCount, over = Math.max(0, P.freeUsed - q);
  const pcs = over + P.tops.filter(t => ITEM[t.name] && ITEM[t.name].price > 0).reduce((a, t) => a + t.n, 0);
  const money = P.tops.reduce((a, t) => a + t.extra, 0);
  return `<span class="cnts"><span class="cnt">ฟรี ${Math.min(P.freeUsed, q)}/${q}</span>` +
    (pcs ? `<span class="cnt over">คิดเพิ่ม ${pcs} ชิ้น +${baht(money)}</span>` : '') + `</span>`;
}

/* ปุ่มแยกท็อปปิ้ง: ท้ายขั้นท็อปปิ้ง ใหญ่เต็มแถว ขอบส้มให้เห็นชัด · แสดงเมื่อแก้วมีท็อปปิ้ง */
function sepHtml(P){
  if(!P.tops.some(t => !t.removed)) return '';
  const on = !!sel.sep;
  return `<button class="sep ${on ? 'on' : ''}" data-sep aria-pressed="${on}"><span class="sepbox">${on ? icon('check', 20) : ''}</span>` +
    `<span>แยกท็อปปิ้ง<small>ใส่ถ้วยแยกจากโยเกิร์ต</small></span><b>+${baht(CONFIG.separateToppingPrice)}</b></button>`;
}
function greekTopsHtml(P){
  const chip = it => {
    const t = P.tops.find(x => x.name === it.name), cnt = t ? t.n : 0;
    /* บรรทัดล่าง: จำนวน (×2) และเงินที่คิดเพิ่ม ไม่เขียนว่า "ฟรี" เพราะเลือกเกินโควตาแล้วจะไม่ฟรี
       ปุ่มสูงคงที่ (CSS) ไม่มีอะไรจะบอกก็ไม่ใส่บรรทัดล่าง ชื่อจึงอยู่กลางปุ่ม */
    let tag = '';
    if(cnt) tag = [cnt > 1 ? '×' + cnt : '', t.extra ? '+' + t.extra : ''].filter(Boolean).join(' · ');
    else if(P.perTop) tag = '+' + P.perTop;
    else if(it.price > 0) tag = '+' + it.price;
    else if(P.freeUsed >= CONFIG.freeToppingCount) tag = '+' + CONFIG.overToppingPrice;
    /* แตะ = เลือก 1 ชิ้น · แตะซ้ำ = เอาออกทั้งหมด · ปรับจำนวนในแถบ "ท็อปปิ้งที่เลือก" ด้านล่าง ปุ่มนี้จึงไม่เปลี่ยนขนาด */
    return `<div class="topw ${cnt ? 'on':''} ${cnt && t.extra ? 'over':''}"><button class="top" data-pick="${esc(it.name)}"><span class="tn">${esc(it.th || it.name)}</span>${tag ? `<small>${tag}</small>` : ''}</button></div>`;
  };
  let h = '';
  CONFIG.cats.forEach(c => {
    const list = CONFIG.items.filter(i => i.cat === c.id && i.price === 0);
    h += `<div class="gt">${c.th || c.name}</div><div class="tops">${list.map(chip).join('')}</div>`;
  });
  h += `<div class="gt">${P.perTop ? 'Extra' : 'Extra · คิดเพิ่มตามราคา'}</div><div class="tops">${CONFIG.items.filter(i => i.price > 0).map(chip).join('')}</div>`;
  /* แถบสรุป: เรียงตามลำดับที่เลือก · − จนเหลือ 0 = เอาออก */
  if(P.tops.length) h += `<div class="gt">ท็อปปิ้งที่เลือก</div><div class="tsel">` + P.tops.map(t => { const nm = esc(t.name);
    return `<div class="trow ${t.extra ? 'over':''}"><span class="nm">${esc(topName(t.name))}</span>${t.extra ? `<span class="px">+${t.extra}</span>` : ''}` +
      `<div class="tqty"><button data-less="${nm}" aria-label="ลด ${esc(topName(t.name))}">−</button><b>${t.n}</b><button data-more="${nm}" aria-label="เพิ่ม ${esc(topName(t.name))}">+</button></div></div>`; }).join('') + `</div>`;
  h += sepHtml(P);
  h += `<p class="hint">แตะเพื่อเลือก แตะอีกครั้งเพื่อเอาออก · เพิ่มหรือลดจำนวนที่ "ท็อปปิ้งที่เลือก"<br>${P.perTop ? `ขนาดนี้ทุกท็อปปิ้ง +${P.perTop} บาท/ชิ้น (รวม Extra) ไม่มีโควตาฟรี</p>` : `ฟรี ${CONFIG.freeToppingCount} ชิ้นแรก · ชิ้นที่ ${CONFIG.freeToppingCount+1} ขึ้นไป +${CONFIG.overToppingPrice} บาท/ชิ้น · Extra คิดตามราคาต่อชิ้น</p>`}`;
  return h;
}
function presetHtml(m){
  const P = priceSel();
  let h = '<p class="hint" style="margin:0 0 4px">เปลี่ยนได้ในหมวดเดียวกัน · เปลี่ยนเป็นของ Extra คิดเงินเพิ่มตามราคา (แต่ไม่แนะนำให้เปลี่ยน)</p>';
  m.defaults.forEach((d, i) => {
    const cur = sel.comps[i], removed = cur === null, ch = !removed && cur !== d;
    h += `<div class="comp ${ch ? 'changed' : ''} ${removed ? 'removed' : ''}"><div class="nm">${esc(topName(removed ? d : cur))}<small>${removed ? 'ไม่รับ' : ch ? 'แทน ' + esc(topName(d)) + (P.tops[i].extra ? ` · <b class="px">+${P.tops[i].extra}</b>` : '') : 'มาพร้อมเมนู'}</small></div>` +
         (ch || removed ? `<button class="skip" data-reset="${i}">${removed ? 'ใส่กลับ' : 'คืนค่า'}</button>` : '') +
         (!removed ? `<button class="skip" data-skip="${i}">ไม่รับ</button>` : '') +
         `<button data-swap="${i}">${sel.swapSlot === i ? 'ปิด' : 'เปลี่ยน'}</button></div>`;
    if(sel.swapSlot === i){
      /* เลือกซ้ำกับช่องอื่นได้ (เช่น Acai กล้วย → สตรอว์เบอร์รี่ = สตรอว์เบอร์รี่ 2 ส่วน) ราคาตามกติกาเดิม */
      const cat = ITEM[d].cat;
      const opts = CONFIG.items.filter(it => it.cat === cat && it.name !== cur);
      const cost = it => it.name !== d && it.price > 0 && !(ITEM[d].price > 0) ? it.price : 0;   // ตรงกับ priceItem
      h += `<div class="tops swapgrid">` + (opts.map(it => `<button class="top" data-choose="${esc(it.name)}" data-slot="${i}"><span class="tn">${esc(it.th || it.name)}</span>${cost(it) ? `<small>+${cost(it)}</small>` : ''}</button>`).join('') || '<span class="hint">ไม่มีตัวเลือกอื่นในหมวดนี้</span>') + `</div>`;
    }
  });
  return h + addsHtml(P) + sepHtml(P);
}
/* Acai / Banana Choco: เพิ่มท็อปปิ้ง ชิ้นละ addTopPrice ทุกอย่าง · ปุ่มเปิดตารางเลือก + แถบจำนวนแบบเดียวกับ Greek */
function addsHtml(P){
  const adds = P.tops.filter(t => t.add), price = CONFIG.addTopPrice;
  let h = `<div class="gt">เพิ่มท็อปปิ้ง <small>ชิ้นละ ${price} บาท</small></div>`;
  if(adds.length) h += `<div class="tsel">` + adds.map(t => { const nm = esc(t.name);
    return `<div class="trow over"><span class="nm">เพิ่ม ${esc(topName(t.name))}</span><span class="px">+${t.extra}</span>` +
      `<div class="tqty"><button data-aless="${nm}" aria-label="ลด ${esc(topName(t.name))}">−</button><b>${t.n}</b><button data-amore="${nm}" aria-label="เพิ่ม ${esc(topName(t.name))}">+</button></div></div>`; }).join('') + `</div>`;
  h += `<button class="ghost wide" data-addopen>${sel.addOpen ? 'ปิดรายการท็อปปิ้ง' : '+ เพิ่มท็อปปิ้ง'}</button>`;
  if(sel.addOpen) CONFIG.cats.forEach(c => {
    h += `<div class="gt">${c.th || c.name}</div><div class="tops">` + CONFIG.items.filter(i => i.cat === c.id).map(it => {
      const t = adds.find(x => x.name === it.name);
      return `<div class="topw ${t ? 'on over' : ''}"><button class="top" data-add="${esc(it.name)}"><span class="tn">${esc(it.th || it.name)}</span><small>${t ? `×${t.n} · +${t.extra}` : '+' + price}</small></button></div>`;
    }).join('') + '</div>';
  });
  return h;
}
function renderBuilder(){
  const m = curMenu(), P = priceSel(); let n = 0;
  let h = sec(++n, 'เลือกเมนู', '<div class="bases">' + CONFIG.menus.map(x =>
    `<button class="base ${sel.menu === x.id ? 'on':''}" data-menu="${x.id}"><img class="pic" src="${x.img}" alt=""><div class="nm">${esc(x.name)}</div><small>${menuPriceLabel(x)}</small></button>`).join('') + '</div>');
  if(m){
    if(m.sizes){
      h += sec(++n, 'เลือกขนาด', '<div class="sizes">' + m.sizes.map(s =>
        `<button class="size ${sel.size === s.id ? 'on':''}" data-size="${s.id}">${esc(s.name)}<small>${esc(s.sub)}</small><small><b>${baht(s.price)}</b></small></button>`).join('') + '</div>');
      if(P.noTop) h += sec(++n, 'ท็อปปิ้ง', '<div class="empty" style="padding:6px 0">ขนาดนี้ไม่มีท็อปปิ้ง</div>');
      else h += sec(++n, 'ท็อปปิ้ง', greekTopsHtml(P), topCounter(P));
    } else {
      h += sec(++n, 'ท็อปปิ้งที่มากับเมนู', presetHtml(m));
    }
    if(!m.noHoney) h += sec(++n, 'น้ำผึ้ง <small>(ฟรี)</small>', '<div class="honey">' + CONFIG.honey.map(x =>
      `<button class="hon ${sel.honey === x.id ? 'on':''}" data-honey="${x.id}">${esc(x.name)}</button>`).join('') + '</div>',
      sel.honey ? '' : '<span class="cnts"><span class="cnt need">ต้องเลือก</span></span>');
    h += sec(++n, 'หมายเหตุ <small>(ถ้ามี)</small>', `<input class="note" id="note" placeholder="เช่น แพ้ถั่ว / ไม่เอาถ้วยใหญ่" value="${esc(sel.note)}">`);
  }
  $('builder').innerHTML = h;
  const add = $('btnAdd');
  add.disabled = !m || needHoney();
  add.textContent = !m ? 'เลือกเมนูก่อน' : needHoney() ? `เลือกน้ำผึ้งก่อน · ${baht(P.unit)}` : `เพิ่มลงออเดอร์ · ${baht(P.unit)}`;
}
$('builder').onclick = e => {
  const g = a => e.target.closest(`[data-${a}]`); let el;
  if(el = g('menu')) pickMenu(el.dataset.menu);
  else if(el = g('size')){ sel.size = el.dataset.size; if(MENU[sel.menu].sizes.find(s => s.id === sel.size).noTop) sel.picks = []; }
  else if(el = g('less')){ const i = sel.picks.lastIndexOf(el.dataset.less); if(i >= 0) sel.picks.splice(i, 1); }
  else if(el = g('more')) sel.picks.push(el.dataset.more);
  else if(el = g('pick')){ const n = el.dataset.pick; if(sel.picks.includes(n)) sel.picks = sel.picks.filter(x => x !== n); else sel.picks.push(n); }
  else if(el = g('choose')){ sel.comps[Number(el.dataset.slot)] = el.dataset.choose; sel.swapSlot = null; }
  else if(el = g('reset')){ const i = Number(el.dataset.reset); sel.comps[i] = MENU[sel.menu].defaults[i]; if(sel.swapSlot === i) sel.swapSlot = null; }
  else if(el = g('skip')){ const i = Number(el.dataset.skip); sel.comps[i] = null; if(sel.swapSlot === i) sel.swapSlot = null; }
  else if(el = g('swap')){ const i = Number(el.dataset.swap); sel.swapSlot = sel.swapSlot === i ? null : i; }
  else if(el = g('honey')) sel.honey = el.dataset.honey;
  else if(g('sep')) sel.sep = !sel.sep;
  else if(g('addopen')) sel.addOpen = !sel.addOpen;
  else if(el = g('add')){ const n = el.dataset.add; if(sel.adds.includes(n)) sel.adds = sel.adds.filter(x => x !== n); else sel.adds.push(n); }
  else if(el = g('amore')) sel.adds.push(el.dataset.amore);
  else if(el = g('aless')){ const i = sel.adds.lastIndexOf(el.dataset.aless); if(i >= 0) sel.adds.splice(i, 1); }
  else return;
  renderBuilder();
};
$('builder').addEventListener('input', e => { if(e.target.id === 'note') sel.note = e.target.value; });

/* เพิ่มรายการที่เลือกอยู่ลงตะกร้า · fewTops = จำนวนท็อปปิ้งฟรีที่ลูกค้าขอ เมื่อน้อยกว่าโควตาและพนักงานยืนยันแล้ว
   (ใช้พิมพ์เตือนบนตั๋วครัว และนับในรายงานเพื่อเทียบสต็อก) */
function addSel(fewTops){
  const m = curMenu(); if(!m || needHoney()) return;
  const P = priceSel();
  const item = {menu:m.id, name:m.name, sizeName:P.sizeName, tops:P.tops, ...(!m.noHoney && {honey:sel.honey}), note:sel.note.trim(), unit:P.unit, qty:1, ...(P.sep && {sep:P.sep})};
  if(fewTops !== undefined) item.fewTops = fewTops;
  item.key = JSON.stringify([item.menu, item.sizeName, item.tops.map(t => [t.name, t.n, t.removed ? 1 : 0, t.from, t.add ? 1 : 0]), item.honey, item.sep, item.note]);
  const found = cart.find(i => i.key === item.key);
  if(found) found.qty++; else cart.push(item);
  resetSel(); renderBuilder(); renderCart(); toast('เพิ่มแล้ว', 'check');
}
/* Greek: ท็อปปิ้งฟรีไม่ครบโควตา → ต้องยืนยันก่อน (กึ่งบังคับ ไม่บล็อก เพื่อให้บันทึกตรงกับที่ลูกค้าได้จริง)
   ปุ่มหลัก = กลับไปเลือกเพิ่ม · ไม่มีท็อปปิ้งเลยและมีขนาดราคาเริ่มต้น (69) → เสนอเปลี่ยนขนาดแทน (ลูกค้าไม่ต้องจ่ายเกิน) */
let fewPending = null;
function askFewTops(m, P){
  const q = CONFIG.freeToppingCount, n = P.freeUsed;
  const cur = m.sizes.find(s => s.id === sel.size), plain = m.sizes.find(s => (s.perTop || s.noTop) && s.name === cur.name);
  fewPending = {n, plain: !P.tops.length && plain ? plain.id : null};
  openModal(`<h3 class="warn">${icon('alert', 22)} ท็อปปิ้งฟรีเลือกไป ${n} จาก ${q} อย่าง</h3>
    <button class="pay" id="fewBack">กลับไปเลือกเพิ่ม</button>
    ${fewPending.plain
      ? `<button class="ghost wide" id="fewPlain">เปลี่ยนเป็น ${esc(plain.name)} ไม่ใส่ท็อปปิ้ง · ${baht(plain.price)}</button>`
      : `<button class="ghost wide" id="fewOk">${n ? `ลูกค้าขอแค่ ${n} อย่าง` : 'ลูกค้าไม่เอาท็อปปิ้งฟรี'}</button>`}`);
}
function fewTopsAnswer(id){
  const f = fewPending; fewPending = null; closeModal(); if(!f) return;
  if(id === 'fewOk') addSel(f.n);
  else if(id === 'fewPlain'){ sel.size = f.plain; sel.picks = []; addSel(); }
}
/* แก้ว 69 (ท็อปปิ้งชิ้นละ 15) ที่แพงกว่าแก้วขนาดเดียวกันแบบท็อปปิ้งฟรี 3 อย่าง (89) → เสนอเปลี่ยน (ลูกค้าไม่ต้องจ่ายเกิน)
   เทียบราคาจริงทั้งสองแบบด้วยท็อปปิ้งชุดเดียวกัน · ปุ่มหลัก = เปลี่ยน · ปุ่มรอง = คงไว้ */
let cheapPending = null;
function cheaperSize(m, P){
  if(!P.perTop || !P.tops.length) return null;
  const cur = m.sizes.find(s => s.id === sel.size), alt = m.sizes.find(s => !s.perTop && !s.noTop && s.name === cur.name);
  if(!alt) return null;
  const A = priceItem(m, {...sel, size:alt.id});
  return A.unit < P.unit ? {alt, A} : null;
}
function askCheaper(m, P, c){
  cheapPending = c;
  openModal(`<h3 class="warn">${icon('alert', 22)} แบบท็อปปิ้งฟรี ${CONFIG.freeToppingCount} อย่าง ถูกกว่า ${baht(P.unit - c.A.unit)}</h3>
    <p style="color:var(--mute);margin:0 0 6px">ท็อปปิ้งเท่าเดิม · ${esc(c.alt.name)} ${esc(c.alt.sub)} ราคา ${baht(c.A.unit)} แทน ${baht(P.unit)}</p>
    <button class="pay" id="cheapSwitch">เปลี่ยนเป็น ${esc(c.alt.name)} ${esc(c.alt.sub)} · ${baht(c.A.unit)}</button>
    <button class="ghost wide" id="cheapKeep">คงไว้ ชิ้นละ ${P.perTop} · ${baht(P.unit)}</button>`);
}
function cheaperAnswer(id){
  const c = cheapPending; cheapPending = null; closeModal(); if(!c) return;
  if(id === 'cheapKeep') return addSel();
  sel.size = c.alt.id; renderBuilder();
  const m = curMenu(), P = priceSel();
  if(P.freeUsed < CONFIG.freeToppingCount) return askFewTops(m, P);   // ยังเลือกฟรีได้อีก: ถามว่าจะเพิ่มไหม
  addSel();
}
$('btnAdd').onclick = () => {
  const m = curMenu(); if(!m || needHoney()) return;
  const P = priceSel();
  if(m.sizes && !P.noTop && !P.perTop && P.freeUsed < CONFIG.freeToppingCount) return askFewTops(m, P);
  const c = m.sizes && cheaperSize(m, P); if(c) return askCheaper(m, P, c);
  addSel();
};
</script>
<script>
/* ===== js/ui/cart.js ===== */
/* ---------- Cart ---------- */
let cart = [];
/* โปรโมชันของบิลนี้ (1 บิล 1 โปร) {id, key, top} · ยอดลดคำนวณใหม่ทุกครั้งจากตะกร้า */
let promo = null;
const cartGross = () => cart.reduce((s, i) => s + i.unit * i.qty, 0);
const promoNow = () => promo && PROMO[promo.id] ? promoEval(PROMO[promo.id], cart, promo) : null;
const cartTotal = () => { const r = promoNow(); return cartGross() - (r && r.ok ? r.discount : 0); };

function renderCart(){
  if(!cart.length) $('cart').innerHTML = '<div class="empty">ยังไม่มีรายการ<br>เลือกเมนูได้เลย</div>';
  else $('cart').innerHTML = cart.map((i, idx) => `
    <div class="line">
      <div class="t"><span>${esc(itemTitle(i))}</span><span>${baht(i.unit * i.qty)}</span></div>
      <div class="d">${itemLines(i).map(esc).join('<br>')}</div>
      <div class="qty">
        <button data-m="${idx}">−</button><b>${i.qty}</b><button data-p="${idx}">+</button>
        <button class="rm" data-r="${idx}" aria-label="ลบรายการ" title="ลบรายการ">${icon('trash', 22)}</button>
      </div>
    </div>`).join('');
  renderPromoBox();
  const t = cartTotal(), n = cart.reduce((s, i) => s + i.qty, 0);
  $('total').textContent = baht(t); $('barTotal').textContent = baht(t); $('barCount').textContent = n + ' รายการ';
  $('btnPay').disabled = $('btnPay2').disabled = !cart.length;
  $('btnClear').disabled = !cart.length;
}
$('cart').onclick = e => {
  const g = a => e.target.closest(`[data-${a}]`); let el;
  if(el = g('p')) cart[el.dataset.p].qty++;
  else if(el = g('m')){ const i = cart[el.dataset.m]; i.qty--; if(i.qty <= 0) cart.splice(el.dataset.m, 1); }
  else if(el = g('r')) cart.splice(el.dataset.r, 1);
  else return;
  renderCart();
};
$('btnClear').onclick = () => {
  if(!cart.length) return;
  askConfirm({msg:'ล้างออเดอร์ทั้งหมด?', yes:'ล้างออเดอร์', onYes:() => { cart = []; promo = null; resetSel(); renderBuilder(); renderCart(); toast('ล้างออเดอร์แล้ว'); }});
};
</script>
<script>
/* ===== js/ui/promo-ui.js ===== */
/* ---------- โปรโมชัน: ปุ่มในกล่องออเดอร์ + หน้าต่างเลือกโปร (1 บิล 1 โปร) ---------- */
function renderPromoBox(){
  const box = $('promoBox');
  if(!cart.length || !CONFIG.promos.length){ box.innerHTML = ''; return; }
  let r = promoNow();
  if(promo && (!r || !r.ok)){   // ตะกร้าเปลี่ยนจนไม่เข้าเงื่อนไข → ยกเลิกโปร และบอกพนักงาน
    const name = PROMO[promo.id] ? PROMO[promo.id].name : promo.id;
    toast(`ยกเลิกโปร ${name} · ${r ? r.why : 'ไม่มีโปรนี้แล้ว'}`, 'alert'); promo = null; r = null;
  }
  if(promo && r){ promo.key = r.target.key; promo.top = r.target.top || null; }   // เป้าหมายเดิมหายไป → ใช้รายการแรก
  box.innerHTML = promo
    ? `<button class="promo on" id="promoOpen">${icon('tag', 20)}<span><b>${esc(PROMO[promo.id].name)}</b><small>${esc(r.detail)}</small></span><b class="px">-${baht(r.discount)}</b></button>`
    : `<button class="promo" id="promoOpen">${icon('tag', 20)}<span>ใช้โปรโมชัน<small>1 บิลใช้ได้ 1 โปร</small></span></button>`;
}
let promoDraft = null;
function openPromo(){ promoDraft = promo ? {...promo} : null; renderPromo(); }
function renderPromo(){
  const d = promoDraft, rd = d ? promoEval(PROMO[d.id], cart, d) : null;
  let h = `<h3>${icon('tag', 22)} โปรโมชัน</h3><p class="note2" style="margin:-6px 0 10px">1 บิลใช้ได้ 1 โปร · ค่าที่บวกเพิ่ม (เปลี่ยน/เพิ่มท็อปปิ้ง, แยกท็อปปิ้ง) คิดตามปกติ</p><div class="popts">`;
  CONFIG.promos.forEach(p => {
    const r = promoEval(p, cart, d && d.id === p.id ? d : null);
    h += `<button class="popt ${d && d.id === p.id ? 'on' : ''}" data-pid="${p.id}" ${r.ok ? '' : 'disabled'}><span><b>${esc(p.name)}</b><small>${esc(p.sub)}</small>${r.ok ? '' : `<small class="why">${icon('alert', 14)} ${esc(r.why)}</small>`}</span>${r.ok ? `<b class="px">-${baht(r.discount)}</b>` : ''}</button>`;
  });
  h += '</div>';
  if(rd && rd.ok && rd.targets.length > 1){
    h += `<div class="q2">ใช้กับ</div><div class="ptargets">` + rd.targets.map((t, i) =>
      `<button class="opt ${t.key === rd.target.key && (t.top || null) === (rd.target.top || null) ? 'on' : ''}" data-ptarget="${i}">${esc(t.label)}</button>`).join('') + '</div>';
  }
  h += `<div class="row payrow">${promo ? '<button class="ghost" id="promoNone">ไม่ใช้โปร</button>' : '<button class="ghost" id="promoCancel">กลับ</button>'}` +
    `<button class="pay" id="promoOk" ${rd && rd.ok ? '' : 'disabled'}>${rd && rd.ok ? `ใช้โปรนี้ · -${baht(rd.discount)}` : 'เลือกโปรก่อน'}</button></div>`;
  openModal(h);
}
function promoPick(id){ promoDraft = {id, key:null, top:null}; renderPromo(); }
function promoTarget(i){
  const r = promoEval(PROMO[promoDraft.id], cart, promoDraft), t = r.targets[i]; if(!t) return;
  promoDraft.key = t.key; promoDraft.top = t.top || null; renderPromo();
}
function promoApply(){
  const r = promoDraft && promoEval(PROMO[promoDraft.id], cart, promoDraft); if(!r || !r.ok) return;
  promo = {id:promoDraft.id, key:r.target.key, top:r.target.top || null}; promoDraft = null;
  closeModal(); renderCart(); toast(`ใช้โปร ${PROMO[promo.id].name} แล้ว`, 'check');
}
function promoClear(){ promo = null; promoDraft = null; closeModal(); renderCart(); toast('ไม่ใช้โปรแล้ว'); }
$('promoBox').onclick = e => { if(e.target.closest('#promoOpen')) openPromo(); };
</script>
<script>
/* ===== js/ui/pay.js ===== */
/* ---------- Payment ---------- */
/* ไม่เลือกอะไรไว้ก่อน · ต้องเลือกกินเลย/กลับบ้านก่อน ปุ่มวิธีชำระเงินจึงจะกดได้ */
let pay = {dining:null, method:null, received:0}, lastSale = null;
function openPay(){ if(!cart.length) return; pay = {dining:null, method:null, received:0}; renderPay(); }
function renderPay(){
  const total = cartTotal(), change = pay.received - total;
  const cashOk = pay.method !== 'cash' || pay.received >= total;
  const ok = !!pay.dining && !!pay.method && cashOk;
  const hadFocus = document.activeElement && document.activeElement.id === 'recv';
  const pr = promoNow();
  let h = `<h3>ชำระเงิน · ${baht(total)}</h3>${pr && pr.ok ? `<p class="note2" style="margin:-6px 0 8px">${icon('tag', 16)} หักโปร ${esc(PROMO[promo.id].name)} -${baht(pr.discount)} แล้ว</p>` : ''}
    <div class="q2">รับที่ร้านหรือกลับบ้าน?</div>
    <div class="row">${CONFIG.dining.map(d => `<button class="opt ${pay.dining === d.id ? 'on':''}" data-dine="${d.id}">${esc(d.name)}</button>`).join('')}</div>
    <div class="q2">วิธีชำระเงิน${pay.dining ? '' : ' <small>(เลือกกินเลย / กลับบ้านก่อน)</small>'}</div>
    <div class="row wrap">${CONFIG.methods.map(x => `<button class="opt ${pay.method === x.id ? 'on':''}" data-method="${x.id}" ${pay.dining ? '' : 'disabled'}>${x.logo ? `<img class="mlogo" src="${x.logo}" alt="">` : `<span class="mlogo">${icon(x.icon, 36)}</span>`}<span>${esc(x.name)}</span></button>`).join('')}</div>`;
  if(!pay.method){ /* ยังไม่เลือกวิธีชำระ: ไม่แสดงส่วนรับเงิน */ }
  else if(pay.method === 'cash'){
    h += `<div class="quick"><button data-q="${total}">พอดี</button>${[20,50,100,500,1000].map(v => `<button data-q="${v}">${v}</button>`).join('')}</div>
      <input class="num" id="recv" inputmode="numeric" placeholder="รับเงินมา" value="${pay.received || ''}">
      <div class="change">${pay.received ? (change >= 0 ? 'เงินทอน ' + baht(change) : '<span style="color:var(--bad)">ยังขาด ' + baht(-change) + '</span>') : '&nbsp;'}</div>`;
  } else if(pay.method === 'promptpay' && SETTINGS.promptpay && !PP.problem(SETTINGS.promptpay)){
    h += `<div class="ppqr">${qrSvg(PP.payload(SETTINGS.promptpay, total), 220)}
      <div class="ppamt">${baht(total)}</div>
      <p class="note2">ให้ลูกค้าสแกน แล้ว<b>ดูสลิปว่ายอด ${baht(total)} โอนสำเร็จ</b> จึงกดยืนยัน</p></div>`;
  } else {
    if(pay.method === 'promptpay') h += `<div class="ppwarn">${icon('alert', 18)} ยังไม่ได้ตั้งเลข PromptPay จึงแสดง QR ไม่ได้ · หัวหน้าตั้งได้ที่ สรุปยอด → ตั้งค่า</div>`;
    h += `<p style="color:var(--mute);margin:14px 0">ตรวจสอบว่ายอด <b>${baht(total)}</b> ผ่านเรียบร้อย (${esc(METHOD[pay.method].name)}) แล้วจึงกดยืนยัน</p>`;
  }
  h += `<div class="row payrow"><button class="ghost" id="payCancel">ยกเลิก</button>
    <button class="pay" id="payOk" ${ok ? '' : 'disabled'}>${ok ? 'ยืนยันการชำระเงิน' : !pay.dining ? 'เลือกกินเลย / กลับบ้านก่อน' : !pay.method ? 'เลือกวิธีชำระเงินก่อน' : 'รับเงินยังไม่ครบ'}</button></div>`;
  openModal(h);
  const r = $('recv');
  if(r){
    r.oninput = () => { pay.received = Number(r.value.replace(/\D/g, '')) || 0; renderPay(); const n = $('recv'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    if(hadFocus){ r.focus(); r.setSelectionRange(r.value.length, r.value.length); }
  }
}
function confirmPay(){
  if(!pay.dining || !pay.method || STORE_MODE === 'loading') return;
  const total = cartTotal(), now = new Date(), sales = loadSales(), biz = bizDate(now), pr = promoNow();
  const no = (sales.filter(s => s.date === biz).length % 999) + 1;
  const sale = {
    id: now.getTime(), no, date: biz, ts: now.toISOString(), dining: pay.dining,
    items: cart.map(i => ({menu:i.menu, name:i.name, sizeName:i.sizeName, tops:i.tops, ...(i.honey !== undefined && {honey:i.honey}), note:i.note, unit:i.unit, qty:i.qty, ...(i.sep && {sep:i.sep}), ...(i.fewTops !== undefined && {fewTops:i.fewTops})})),
    total, method: pay.method, received: pay.method === 'cash' ? pay.received : total,
    change: pay.method === 'cash' ? pay.received - total : 0, void:false,
    ...(pr && pr.ok && {promo:{id:promo.id, name:PROMO[promo.id].name, discount:pr.discount, detail:pr.detail}})   // บันทึกการใช้โปรทุกครั้ง
  };
  sales.push(sale);
  if(!saveSales(sales)) return;
  lastSale = sale; cart = []; promo = null; renderCart(); updateNext();
  openModal(`<div class="big">${icon('checkCircle', 64)}</div>
    <h3 style="text-align:center">ออเดอร์ #${pad(no, 3)} · ${DINE[sale.dining].name}</h3>
    ${sale.method === 'cash' ? `<div class="change">เงินทอน ${baht(sale.change)}</div>` : `<div class="change" style="color:var(--blue)">ชำระด้วย ${esc(METHOD[sale.method].name)} แล้ว</div>`}
    <button class="pay" id="nextOrder">ออเดอร์ถัดไป</button>
    ${CONFIG.autoPrint ? `<button class="linkbtn" id="prBoth">${icon('printer', 16)} กระดาษไม่ออก? พิมพ์อีกครั้ง</button>` : ''}`);
  if(CONFIG.autoPrint) printSale(sale, 'both');   // ใบเสร็จ + ตั๋วครัวทุกบิล พนักงานไม่ต้องกดอะไร
}
$('btnPay').onclick = $('btnPay2').onclick = openPay;
</script>
<script>
/* ===== js/ui/summary.js ===== */
/* ---------- Summary (PIN) ---------- */
$('btnSummary').onclick = () => askPin(() => { const r = defaultRound(); REP.from = REP.to = r.date; REP.fb = r.fallback; REP.tab = 'items'; renderSummary(); });

let repCsv = null;

const shareCell = p => `${p}%<div class="share"><i style="width:${Math.min(100, p)}%"></i></div>`;
function tbl(head, rows, foot){
  const c = (cells, tag) => cells.map((x, i) => `<${tag} class="${head[i][1] ? 'n' : ''}">${x}</${tag}>`).join('');
  return `<table><tr>${c(head.map(h => h[0]), 'th')}</tr>${rows.map(r => `<tr>${c(r, 'td')}</tr>`).join('')}${foot ? `<tr class="tot">${c(foot, 'td')}</tr>` : ''}</table>`;
}
const EMPTY = '<p class="note2" style="padding:14px 0">ยังไม่มีข้อมูลในช่วงนี้</p>';

function tabItems(R){
  const mi = id => CONFIG.menus.findIndex(m => m.id === id);
  const rows = Object.values(R.items).sort((a, b) => mi(a.menu) - mi(b.menu) || a.name.localeCompare(b.name, 'th'));
  if(!rows.length) return {html:EMPTY, csv:[]};

  rows.forEach(r => { const b = byMenu[r.menu] || (byMenu[r.menu] = {name: MENU[r.menu] ? MENU[r.menu].name : r.menu, qty:0, rev:0}); b.qty += r.qty; b.rev += r.rev; });

          `<div class="sec2">ตามรายการ <small>(แยกขนาด)</small></div>` + tbl(H, rows.map(line)),
    csv: [['รายการ','จำนวน (แก้ว)','ยอดขาย','สัดส่วนยอดขาย %']].concat(rows.map(r => [r.name, r.qty, r.rev, pct(r.rev, R.total)]))
  };
}
function tabPay(R){
  if(!R.bills) return {html:EMPTY, csv:[]};
  const H = [['ช่องทางชำระเงิน'], ['จำนวนบิล', 1], ['ยอดขาย', 1], ['เฉลี่ย/บิล', 1], ['สัดส่วนยอดขาย']];
  const rows = CONFIG.methods.map(m => { const v = R.methods[m.id]; return [esc(m.name), v.bills, baht(v.rev), v.bills ? baht(Math.round(v.rev / v.bills)) : '–', shareCell(pct(v.rev, R.total))]; });
  return {

let csvPending = null;

/* เปิดหน้าต่างส่งออกแทนการดาวน์โหลดทันที เพื่อไม่ให้หน้า POS ถูกเปลี่ยนเป็นหน้าว่าง (จอขาว) */
function downloadCsv(filename, rows, back){
  csvPending = {filename, text: csvText(rows), back: back || null};
  const canShare = !!(navigator.canShare && window.File && (() => { try{ return navigator.canShare({files:[new File(['x'], 'a.csv', {type:'text/csv'})]}); }catch(e){ return false; } })());

      <button class="opt" id="csvCopy">${icon('copy')} คัดลอกข้อความ</button>
    </div>
    <p class="note2">ถ้ากดดาวน์โหลดแล้วไม่มีไฟล์ (เช่นบน iPad) ให้ใช้ "แชร์ / บันทึกลง Files" หรือ "คัดลอก" แล้ววางใน Google Sheets / Excel</p>
    <textarea class="csvbox" id="csvText" readonly></textarea>
    <div class="row"><button class="pay" id="csvBack">${back ? 'กลับไปหน้าสรุป' : 'ปิด'}</button></div>`);
  $('csvText').value = csvPending.text;
}
function csvDownload(){
  const c = csvPending; if(!c) return;
  try{
    const url = URL.createObjectURL(new Blob(['﻿' + c.text], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = c.filename; a.target = '_blank'; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
    toast('กำลังดาวน์โหลด…');
  }catch(e){ toast('ดาวน์โหลดไม่ได้ ลองใช้ "คัดลอก" แทน'); }
}
async function csvShare(){
  const c = csvPending; if(!c) return;
  try{ await navigator.share({files:[new File(['﻿' + c.text], c.filename, {type:'text/csv'})], title:c.filename}); }
  catch(e){ if(e && e.name !== 'AbortError') toast('แชร์ไม่สำเร็จ ลองใช้ "คัดลอก" แทน'); }
}
async function csvCopy(){
  const c = csvPending; if(!c) return;
  try{ await navigator.clipboard.writeText(c.text); toast('คัดลอกแล้ว', 'check'); }
  catch(e){ const t = $('csvText'); t.focus(); t.select(); try{ document.execCommand('copy'); toast('คัดลอกแล้ว', 'check'); }catch(_){ toast('กดค้างที่ข้อความแล้วเลือกคัดลอก'); } }
}
function billsCsvRows(list){
  const rows = [['วันที่รอบขาย','เวลา','บิล','รับประทาน','รายการ','ยอดรวม','วิธีจ่าย','สถานะ','ประวัติ','โปรโมชัน','ส่วนลด']];

    rows.push([s.date, `${pad(t.getHours())}:${pad(t.getMinutes())}`, pad(s.no, 3), DINE[s.dining].name,

  });
  return rows;
}

<script>
/* ===== demo-seed.js ===== */
/* ---------- DEMO: ข้อมูลตัวอย่าง 3 รอบขายล่าสุด สร้างใหม่อัตโนมัติเมื่อข้อมูลเก่า (เก็บแยกจากตัวจริง) ---------- */
function seedDemo(force){
  const cur = bizDate(new Date()), SEEDKEY = KEY + '_for';
  let seededFor = null; try{ seededFor = localStorage.getItem(SEEDKEY); }catch(e){}
  if(!force && seededFor === cur && loadSales().length) return;
  let seed = 20261005; const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const freeNames = CONFIG.items.filter(i => i.price === 0).map(i => i.name), extraNames = CONFIG.items.filter(i => i.price > 0).map(i => i.name);
  const swapPool = {dried:['Almonds','Chia','Cacao nibs','Granola'], fruit:['Mango','Kiwi'], sauce:['Caramel','Hazelnut spread']};
  const sales = [], now = new Date();
  /* รอบขาย D = (D-1) 23:00 ถึง D 22:59 · ขายจริงช่วง 10:00–21:00 ของวัน D
     ถ้าตอนนี้เลย 23:00 ไปแล้ว รอบปัจจุบันยังไม่เริ่มขาย จึงสร้างให้ 3 รอบก่อนหน้า */
  const lastFull = addDays(cur, now.getHours() >= CONFIG.resetHour ? -1 : 0);
  [2, 1, 0].forEach(back => {
    const D = addDays(lastFull, -back), [y, m, d] = D.split('-').map(Number);
    const n = 14 + Math.floor(rnd() * 8); let no = 0;
    for(let k = 0; k < n; k++){
      const when = new Date(y, m - 1, d, 10 + Math.floor(k * 11 / n), Math.floor(rnd() * 60));
      if(when > now) break;
      const items = [];
      for(let q = rnd() < .25 ? 2 : 1; q > 0; q--){
        const r = rnd(), id = r < .55 ? 'greek' : r < .8 ? 'acai' : 'banana', mm = MENU[id];
        resetSel(); pickMenu(id);
        if(id === 'greek'){
          sel.size = pick(['g1n','g1','g1','g2','g2']);
          if(sel.size === 'g1n'){ if(rnd() < .4) sel.picks.push(pick(freeNames)); }   // แก้ว 69: ส่วนใหญ่ไม่ใส่ บางแก้วใส่ 1 ชิ้น (+15)
          else for(let t = 1 + Math.floor(rnd() * 4); t > 0; t--) sel.picks.push(rnd() < .2 ? pick(extraNames) : (rnd() < .3 && sel.picks.length ? sel.picks[0] : pick(freeNames)));
        } else {
          mm.defaults.forEach((dd, i) => { const x = rnd(); if(x < .08) sel.comps[i] = null; else if(x < .18){ const c = pick(swapPool[ITEM[dd].cat]); if(!sel.comps.includes(c)) sel.comps[i] = c; } });
        }
        sel.sep = rnd() < .12;   // แยกท็อปปิ้ง +5 บางแก้ว
        sel.honey = pick(['normal','normal','normal','lots','little','side','none']);
        const P = priceSel();
        const it = {menu:mm.id, name:mm.name, sizeName:P.sizeName, tops:P.tops, ...(!mm.noHoney && {honey:sel.honey}), note:'', unit:P.unit, qty:1, ...(P.sep && {sep:P.sep})};
        if(mm.sizes && !P.noTop && !P.perTop && P.freeUsed < CONFIG.freeToppingCount) it.fewTops = P.freeUsed;   // เหมือนพนักงานกดยืนยัน "ลูกค้าขอแค่ N อย่าง"
        items.push(it);
      }
      resetSel();
      const total = items.reduce((a, i) => a + i.unit * i.qty, 0), method = pick(['cash','cash','promptpay','promptpay','promptpay','tcp']);
      const sale = {id: when.getTime() + k, no: ++no, date: D, ts: when.toISOString(), dining: pick(['dinein','dinein','takeaway']), items, total, method,
        received: method === 'cash' ? Math.ceil(total / 100) * 100 : total, change: 0, void: false};
      sale.change = sale.received - total;
      if(back === 1 && k === 3){ sale.void = true; sale.voidAt = new Date(when.getTime() + 120000).toISOString(); sale.log = [{act:'void', at:sale.voidAt}]; }
      sales.push(sale);
    }
  });
  clearSales(); saveSales(sales);
  try{ localStorage.setItem(SEEDKEY, cur); }catch(e){}
}
storeReady.then(() => seedDemo(false));
$('btnReseed').innerHTML = icon('refresh', 18) + ' ข้อมูลตัวอย่างใหม่';
$('btnReseed').onclick = () => askConfirm({msg:'สร้างข้อมูลตัวอย่างใหม่?', sub:'บิลใน DEMO ทั้งหมดจะถูกแทนที่', yes:'สร้างใหม่', ok:true, onYes:() => { seedDemo(true); updateNext(); toast('สร้างข้อมูลตัวอย่างแล้ว', 'check'); }});
</script>
<script>
/* ===== js/ui/main.js ===== */
/* ---------- เลขออเดอร์ถัดไป + ตัวจัดการคลิกใน modal + เริ่มต้นหน้าจอ (ไฟล์สุดท้าย) ---------- */
function updateNext(){ $('nextNo').textContent = 'ออเดอร์ถัดไป #' + pad(nextNo(), 3); }

/* ---------- Modal click handler (ชำระเงิน / สรุปยอด / พิมพ์) ---------- */
$('modal').onclick = e => {
  const g = a => e.target.closest(`[data-${a}]`); let el;
  if(el = g('dine')){ pay.dining = el.dataset.dine; renderPay(); return; }
  if(el = g('method')){ if(!pay.dining) return; pay.method = el.dataset.method; if(pay.method !== 'cash') pay.received = 0; renderPay(); return; }
  if(el = g('q')){ pay.received = Number(el.dataset.q); renderPay(); return; }
  if(el = g('pid')){ promoPick(el.dataset.pid); return; }
  if(el = g('ptarget')){ promoTarget(Number(el.dataset.ptarget)); return; }
  if(el = g('v') || g('restore')){
    const isVoid = !!el.dataset.v, sid = isVoid ? el.dataset.v : el.dataset.restore;
    const sv = loadSales().find(x => String(x.id) === sid); if(!sv) return;
    askConfirm(isVoid
      ? {msg:`ยกเลิกบิล #${pad(sv.no, 3)}?`, sub:'ระบบจะเก็บประวัติไว้ และนำกลับมาได้ภายหลัง', yes:'ยกเลิกบิล'}
      : {msg:`นำบิล #${pad(sv.no, 3)} กลับมา?`, sub:`ยอด ${baht(sv.total)} จะถูกนับในยอดขายอีกครั้ง`, yes:'นำกลับ', ok:true});
    confirmCb = () => {
      const all = loadSales(), x = all.find(y => String(y.id) === sid);
      if(x){ const at = new Date().toISOString(); x.void = isVoid; (x.log = x.log || []).push({act: isVoid ? 'void' : 'restore', at}); if(isVoid) x.voidAt = at; else delete x.voidAt; saveSales(all); toast(isVoid ? 'ยกเลิกบิลแล้ว' : 'นำบิลกลับแล้ว', isVoid ? null : 'check'); }
      renderSummary();
    };
    confirmNo = renderSummary;
    return;
  }
  if(el = g('prr')){ const s = loadSales().find(x => String(x.id) === el.dataset.prr); if(s) printSale(s, 'receipt'); return; }
  if(el = g('prk')){ const s = loadSales().find(x => String(x.id) === el.dataset.prk); if(s) printSale(s, 'kitchen'); return; }
  if(el = g('tab')){ REP.tab = el.dataset.tab; renderSummary(); return; }
  if(el = g('range')){ setRange(el.dataset.range); renderSummary(); return; }
  const b = e.target.closest('button'); const id = b && b.id;
  if(id === 'payCancel' || id === 'closeX' || id === 'nextOrder' || id === 'pinNo') closeModal();
  else if(id === 'cfYes'){ const cb = confirmCb; confirmCb = confirmNo = null; closeModal(); if(cb) cb(); }
  else if(id === 'cfNo'){ const cb = confirmNo; confirmCb = confirmNo = null; closeModal(); if(cb) cb(); }
  else if(id === 'pinOk') checkPin();
  else if(id === 'fewBack' || id === 'fewOk' || id === 'fewPlain') fewTopsAnswer(id);
  else if(id === 'cheapSwitch' || id === 'cheapKeep') cheaperAnswer(id);
  else if(id === 'promoOk') promoApply();
  else if(id === 'promoNone') promoClear();
  else if(id === 'promoCancel'){ promoDraft = null; closeModal(); }
  else if(id === 'csvTab'){ if(repCsv) downloadCsv(repCsv.name, repCsv.rows, true); }
  else if(id === 'csvDl') csvDownload();
  else if(id === 'csvShare') csvShare();
  else if(id === 'csvCopy') csvCopy();
  else if(id === 'csvBack'){ const b = csvPending && csvPending.back; csvPending = null; if(b) renderSummary(); else closeModal(); }
  else if(id === 'csvAll') exportCsv();
  else if(id === 'payOk') confirmPay();
  else if(id === 'prBoth' && lastSale) printSale(lastSale, 'both');
  else if(id === 'prTest') printTest();
  else if(id === 'setOpen') openSettings();
  else if(id === 'setSave') settingsSave();
  else if(id === 'setBack') renderSummary();
  else if(id === 'prOff') disconnectPrinter();
};

/* ---------- Init ---------- */
$('pageStyle').textContent = '@page{size:' + CONFIG.paperMm + 'mm auto;margin:0}';
document.documentElement.style.setProperty('--paper', CONFIG.paperMm + 'mm');
$('btnSummary').innerHTML = icon('chart', 18) + ' สรุปยอด';
renderBuilder(); renderCart();
storeReady.then(updateNext);   // เลขออเดอร์ต้องรอโหลดบิลจาก IndexedDB ก่อน
/* PWA: ใช้งานออฟไลน์ได้ (ต้องเปิดผ่าน https หรือ localhost · ต้นแบบไฟล์เดียวไม่มี manifest จึงข้าม) */
if('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker', e));
</script>
