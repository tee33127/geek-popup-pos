<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Geek Pop-up POS (DEMO)</title>
<meta name="theme-color" content="#1A00B8">
<style id="pageStyle"></style>
<style>
:root{
  --blue:#1A00B8; --blue-soft:#ECE9FF; --orange:#F7941D; --orange-soft:#FFF1DE;
  --ink:#1b1b2f; --mute:#6b6b80; --line:#e3e3ee; --bg:#f6f6fb; --ok:#14804a; --bad:#c62828;
}
/* ไอคอนเส้น (icons.js) จัดให้อยู่กลางบรรทัดข้อความ */
.ic{display:inline-block;vertical-align:-.2em;flex-shrink:0}
.big .ic{color:var(--ok)}
h3.warn .ic{color:var(--orange)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,-apple-system,sans-serif;font-size:17px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
header{background:var(--blue);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;font-weight:700}
header h1 span{color:var(--orange)}
#nextNo{font-size:14px;opacity:.9;margin-left:auto}
.hbtn{background:rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:10px;font-size:15px}
.hbtn .ic{vertical-align:-3px}
.hbtn.off{background:var(--orange);color:var(--blue);font-weight:700}   /* ยังไม่เชื่อมปริ้นเตอร์: เด่นให้พนักงานเห็น */
main{display:grid;grid-template-columns:1fr 390px;gap:16px;padding:16px;max-width:1200px;margin:0 auto;align-items:start}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(20,0,120,.08)}
.step{display:flex;align-items:center;gap:10px;font-weight:700;margin:0 0 12px;font-size:18px}
.step b{background:var(--blue);color:#fff;min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.step small{font-weight:400;color:var(--mute);font-size:14px}
.step .cnts{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.step .cnt{background:var(--blue-soft);color:var(--blue);font-weight:700;padding:3px 10px;border-radius:20px;font-size:14px}
.step .cnt.over{background:var(--orange-soft);color:#b45f00}
.sec{margin-bottom:22px}
.hint{color:var(--mute);font-size:14px;margin:8px 0 0}
.gt{font-weight:700;color:var(--mute);font-size:15px;margin:14px 0 8px}
.bases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.base{border:3px solid var(--line);border-radius:16px;padding:8px 8px 10px;text-align:center;background:#fff}
.base .pic{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block;pointer-events:none}
.base .nm{font-weight:700;margin-top:8px}
.base small{display:block;color:var(--mute)}
.base.on{border-color:var(--blue);background:var(--blue-soft)}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.size{border:3px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-weight:700;background:#fff}
.size small{display:block;color:var(--mute);font-weight:400;margin-top:2px;font-size:13px}
.size small b{color:var(--ink);font-size:17px}
.size.on{border-color:var(--orange);background:var(--orange-soft)}
.tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:8px}   /* 152px: ชื่อยาวสุด (เม็ดมะม่วงหิมพานต์ 131px ที่ 17px) อยู่ในบรรทัดเดียว */
.top{border:2px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;background:#fff;line-height:1.25}
.top small{display:block;color:var(--mute);font-size:13px}
.top.on{border-color:var(--blue);background:var(--blue-soft);font-weight:700}
.top.on small{color:var(--blue)}
.top.on::before{content:"✓ "}
.top.on.over{border-color:var(--orange);background:var(--orange-soft)}
.top.on.over small{color:#b45f00}
.swapgrid{margin:-2px 0 12px;padding:10px;background:var(--bg);border-radius:12px}
.swapgrid .top{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap}   /* ปุ่มตัวเลือกสูงเท่ากัน มีราคาหรือไม่ก็ตาม */
.comp{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.comp.changed{border-color:var(--orange);background:var(--orange-soft)}
.comp .nm{flex:1;font-weight:700}
.comp .nm small{display:block;font-weight:400;color:var(--mute);font-size:14px}
.comp .px{color:#b45f00}
.comp button{background:var(--bg);padding:8px 14px;border-radius:10px;font-weight:700;font-size:15px}
.comp button.skip{background:none;color:var(--mute);font-weight:400;font-size:13px;text-decoration:underline;padding:8px 6px}
.comp.removed{background:var(--bg)}
.comp.removed .nm{color:var(--mute)}
.comp.removed .nm{text-decoration:line-through}
.comp.removed .nm small{text-decoration:none}
/* ปุ่มท็อปปิ้ง Greek: สูงเท่ากันทุกปุ่มทุกสถานะ · ✓ เป็นวงกลมที่มุมซ้ายบนตำแหน่งเดียวกันทุกปุ่ม */
.topw{position:relative;height:64px;border:2px solid var(--line);border-radius:12px;background:#fff}
.topw .top{border:0;background:none;width:100%;height:100%;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.topw .tn{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* ชื่อไม่ขึ้นบรรทัดใหม่ */
.topw.on{border-color:var(--blue);background:var(--blue-soft)}
.topw.on .top small{color:var(--blue)}
.topw.on::before{content:"✓";position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;pointer-events:none;z-index:1}
.topw.on.over{border-color:var(--orange);background:var(--orange-soft)}
.topw.on.over::before{background:var(--orange)}
.topw.on.over .top small{color:#b45f00}
.tsel{border:2px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;background:#fff}
.trow + .trow{border-top:1px solid var(--line)}
.trow.over{background:var(--orange-soft)}
.trow .nm{flex:1;font-weight:700}
.trow .px{color:#b45f00;font-weight:700}
.tqty{display:flex;align-items:center;gap:4px}
.tqty button{width:48px;height:48px;border-radius:10px;background:#fff;border:2px solid var(--blue);color:var(--blue);font-size:24px;font-weight:700;line-height:1;font-family:system-ui,sans-serif}
.trow.over .tqty button{border-color:var(--orange);color:#b45f00}
.tqty b{min-width:34px;text-align:center;font-size:20px}
.honey{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.hon{border:3px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;font-weight:700;background:#fff}
.hon.on{border-color:var(--orange);background:var(--orange-soft)}
input.note{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font:inherit}
.add{width:100%;background:var(--orange);color:#fff;font-weight:700;font-size:20px;padding:16px;border-radius:16px;position:sticky;bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.add:disabled{background:#d8d8e4;box-shadow:none}
.cart h2{margin:0 0 10px;font-size:19px}
.empty{color:var(--mute);text-align:center;padding:24px 0}
.line{border-bottom:1px solid var(--line);padding:10px 0}
.line .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.line .d{color:var(--mute);font-size:14.5px;margin:2px 0 6px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:38px;height:38px;border-radius:10px;background:var(--bg);font-size:22px;font-weight:700}
.qty .rm{margin-left:auto;width:48px;height:48px;display:grid;place-items:center;color:var(--bad);background:none;border-radius:10px}
.qty .rm:active{background:#fdecea}
.total{display:flex;justify-content:space-between;font-size:24px;font-weight:800;padding:14px 0 10px}
.pay{width:100%;background:var(--blue);color:#fff;font-weight:700;font-size:20px;padding:16px;border-radius:16px}
.pay:disabled{background:#c9c9de}
.clear{width:100%;margin-top:8px;color:var(--bad);padding:11px;border:2px solid var(--line);border-radius:12px;font-weight:700}
.clear:disabled{opacity:.4}
.bar{display:none}
#modal{position:fixed;inset:0;background:rgba(10,10,40,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal.show{display:flex}
.box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:540px;max-height:92vh;overflow:auto}
.box.wide{max-width:940px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.tab{padding:10px 14px;border-radius:12px;background:var(--bg);font-weight:700;font-size:15px}
.tab.on{background:var(--blue);color:#fff}
.rangebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rangebar input{font:inherit;padding:8px;border:2px solid var(--line);border-radius:10px}
.chip{background:var(--bg);padding:8px 12px;border-radius:20px;font-size:14px;font-weight:700}
th.n,td.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
.sec2{font-weight:800;margin:18px 0 6px;font-size:17px}
.sec2 small{font-weight:400;color:var(--mute);font-size:13px}
.note2{color:var(--mute);font-size:13px;margin:6px 0}
.share{height:7px;background:var(--blue-soft);border-radius:4px;overflow:hidden;min-width:70px;margin-top:3px}
.share i{display:block;height:100%;background:var(--blue)}
.box h3{margin:0 0 12px;font-size:21px}
.q2{font-weight:700;margin:14px 0 4px;color:var(--mute);font-size:15px}
.row{display:flex;gap:10px;margin:8px 0}
.row>*{flex:1}
.row.wrap{flex-wrap:wrap}
.row.wrap>*{flex:1 1 140px}
.opt{border:3px solid var(--line);border-radius:14px;padding:14px 8px;font-weight:700;text-align:center}
.opt.on{border-color:var(--blue);background:var(--blue-soft)}
.opt:disabled{opacity:.4;cursor:not-allowed}
/* ปุ่มวิธีชำระเงิน: โลโก้หรือไอคอนสูงเท่ากัน + ชื่อด้านล่าง */
.opt[data-method]{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 8px}
.opt .mlogo{height:44px;max-width:100%;object-fit:contain;display:grid;place-items:center}
.opt[data-method] span:last-child{font-size:15px}
.payrow .ghost{flex:0 0 120px}
.payrow .pay{flex:1}
.q2 small{font-weight:400;color:var(--mute)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.quick button{background:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700}
input.num{width:100%;font-size:26px;padding:12px;border:2px solid var(--line);border-radius:12px;text-align:right;font-family:inherit}
.change{font-size:30px;font-weight:800;color:var(--ok);text-align:center;margin:12px 0}
.big{font-size:56px;text-align:center}
.ghost{background:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700}
.linkbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:48px;margin-top:6px;color:var(--mute);font-size:14px;text-decoration:underline}
.ghost.wide{display:block;width:100%;margin-top:10px;min-height:52px;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr.void td{color:#aaa;text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--blue-soft);border-radius:14px;padding:12px}
.stat small{color:var(--mute);display:block}
.stat b{font-size:22px}
.sbtn{color:var(--blue);font-size:14px;padding:4px 8px;font-weight:700}
.vbtn{color:var(--bad);font-size:14px;padding:4px 8px}
.rbtn{color:var(--ok);font-size:14px;padding:4px 8px;font-weight:700}
tr.void td:last-child{text-decoration:none;color:inherit}
textarea.csvbox{width:100%;height:180px;font:13px/1.4 monospace;border:2px solid var(--line);border-radius:10px;padding:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:30}
#printArea{display:none}
#printArea .slip{font-family:"Noto Sans Thai","Sarabun",sans-serif;color:#000}
#printArea .c{text-align:center}
#printArea .b{font-weight:700}
#printArea .lg{font-size:15px}
#printArea .r{display:flex;justify-content:space-between;gap:8px}
#printArea .sm{font-size:11px;padding-left:8px;color:#000}
#printArea hr{border:0;border-top:1px dashed #000;margin:5px 0}
#printArea .no{font-size:54px;font-weight:800;text-align:center;line-height:1.05}
#printArea .dine{font-size:26px;font-weight:800;text-align:center;background:#000;color:#fff;padding:3px 0;margin:4px 0}
#printArea .kt{font-size:17px;font-weight:800;margin-top:6px}
#printArea .kl{font-size:14px;padding-left:8px}
@media(max-width:900px){
  main{grid-template-columns:1fr;padding:12px 12px 100px}
  .add{bottom:86px}
  .bar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;gap:10px;align-items:center;z-index:6}
  .bar .sum{flex:1;font-weight:800;font-size:20px}
  .bar .sum small{display:block;font-weight:400;color:var(--mute);font-size:13px}
  .bar button{background:var(--blue);color:#fff;font-weight:700;padding:14px 22px;border-radius:14px;font-size:18px}
  .bar button:disabled{background:#c9c9de}
}
@media print{
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .slip{width:var(--paper,80mm);padding:2mm 3mm;font-size:12px;line-height:1.35;break-after:page;page-break-after:always}
  #printArea .slip:last-child{break-after:auto;page-break-after:auto}
}
/* QR PromptPay (หน้าชำระเงิน + ตั้งค่า) */
.ppqr{text-align:center;margin:12px 0 4px}
.ppqr .qr{display:block;margin:0 auto;max-width:100%;height:auto}
.ppamt{font-size:28px;font-weight:800;color:var(--blue);margin-top:4px}
.ppmsg{min-height:24px;margin:8px 0 0;font-size:15px}
.ppmsg .ic{vertical-align:-3px}
.ppwarn{background:#fff4e5;color:#8a4b00;border-radius:12px;padding:10px 12px;margin:12px 0 0;font-size:15px}
.ppwarn .ic{vertical-align:-4px}
/* ปุ่มแยกท็อปปิ้ง: ท้ายขั้นท็อปปิ้ง เด่นพอให้พนักงานเห็น */
.sep{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;margin:14px 0 6px;padding:10px 16px;border:3px dashed var(--orange);border-radius:14px;background:#fff;font-weight:700;font-size:18px;text-align:left}
.sep small{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.sep b{margin-left:auto;color:#a35400;font-size:18px}
.sepbox{width:28px;height:28px;flex:none;border:3px solid var(--orange);border-radius:8px;display:grid;place-items:center;background:#fff;color:var(--blue)}
.sep.on{background:var(--orange);border-style:solid;color:var(--blue)}
.sep.on small,.sep.on b{color:var(--blue)}
.sep.on .sepbox{border-color:#fff}
.cnt.need{background:#fde8e8;color:var(--bad);font-weight:700}
/* โปรโมชัน: ปุ่มในกล่องออเดอร์ + หน้าต่างเลือกโปร */
.promo{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;margin:10px 0 0;padding:8px 14px;border:2px dashed var(--blue);border-radius:12px;background:#fff;color:var(--blue);font-weight:700;text-align:left}
.promo small{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.promo.on{border-style:solid;background:var(--blue-soft)}
.promo .px{margin-left:auto;color:var(--ok);font-size:18px;white-space:nowrap}
.popts{display:grid;gap:8px}
.popt{display:flex;align-items:center;gap:10px;border:3px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;min-height:64px;background:#fff}
.popt small{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.popt .why{color:#8a4b00;margin-top:2px}
.popt .why .ic{vertical-align:-2px}
.popt .px{margin-left:auto;color:var(--ok);font-size:18px;white-space:nowrap}
.popt.on{border-color:var(--blue);background:var(--blue-soft)}
.popt:disabled{opacity:.6;cursor:not-allowed}
.ptargets{display:grid;gap:8px}
.ptargets .opt{text-align:left;font-weight:600;font-size:15px}
.promotag{color:var(--ok);font-weight:700}
.promotag .ic{vertical-align:-2px}
</style>
</head>
<body>

<header>
  <h1>Geek <span>Pop-up</span> POS · DEMO</h1>
  <span id="nextNo"></span>
  <button class="hbtn" id="btnPrinter"></button>
  <button class="hbtn" id="btnReseed" style="margin-right:6px">ข้อมูลตัวอย่างใหม่</button>
  <button class="hbtn" id="btnSummary">สรุปยอด</button>
</header>

<main>
  <section class="card">
    <div id="builder"></div>
    <button class="add" id="btnAdd" disabled>เลือกเมนูก่อน</button>
  </section>

  <aside class="card cart">
    <h2>ออเดอร์ปัจจุบัน</h2>
    <div id="cart"></div>
    <div id="promoBox"></div>
    <div class="total"><span>รวม</span><span id="total">฿0</span></div>
    <button class="pay" id="btnPay" disabled>ชำระเงิน</button>
    <button class="clear" id="btnClear">ล้างออเดอร์</button>
  </aside>
</main>

<div class="bar">
  <div class="sum"><small id="barCount">0 รายการ</small><span id="barTotal">฿0</span></div>
  <button id="btnPay2" disabled>ชำระเงิน</button>
</div>

<div id="modal"></div>
<div id="toast"></div>
<div id="printArea"></div>


<script>
/* ===== js/config.js ===== */
/* ============ ตั้งค่าร้าน (แก้ราคา/ท็อปปิ้ง/PIN ตรงนี้) ============ */
const CONFIG = {
  pin: '1234',                    // PIN เปิดหน้าสรุปยอด / ยกเลิกบิล
  shopName: 'Geek Yogurt & Smoothie Bar',
  shopSub: 'Pop-up Store',
  resetHour: 23,                  // เลขออเดอร์เริ่มที่ 001 ใหม่ทุกวันเวลา 23:00 น.
  paperMm: 80,                    // ความกว้างกระดาษเครื่องพิมพ์ (80 หรือ 58)
  autoPrint: false,                // พิมพ์ใบเสร็จ+ตั๋วครัวอัตโนมัติหลังชำระเงินทุกบิล (หน้าสำเร็จไม่มีปุ่มพิมพ์ มีแค่ลิงก์พิมพ์ซ้ำ)
  freeToppingCount: 3,            // Greek: ท็อปปิ้งฟรีกี่อย่าง (นับเฉพาะรายการในกลุ่มฟรี)
  overToppingPrice: 15,           // Greek: ท็อปปิ้งฟรีอย่างที่ 4 ขึ้นไป คิดอย่างละกี่บาท

<script>
/* ===== js/core.js ===== */
/* ฟังก์ชันพื้นฐาน: จัดรูปแบบ วันที่ รอบขาย ป้ายข้อความ (ไม่แตะ DOM) */
const baht = n => '฿' + Number(n).toLocaleString('th-TH');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n, l=2) => String(n).padStart(l, '0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDT = ts => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const byId = list => Object.fromEntries(list.map(x => [x.id, x]));
const ITEM = Object.fromEntries(CONFIG.items.map(x => [x.name, x]));
/* ชื่อท็อปปิ้งที่แสดง (ภาษาไทย) จากรหัสอังกฤษที่เก็บในบิล · ไม่รู้จักก็แสดงตามที่เก็บ */
const topName = n => (ITEM[n] && ITEM[n].th) || n;
const MENU = byId(CONFIG.menus), METHOD = byId(CONFIG.methods), HONEY = byId(CONFIG.honey), DINE = byId(CONFIG.dining);

/* รอบขายเปลี่ยนวันตอน 23:00 น. */
function bizDate(d){ const x = new Date(d); if(x.getHours() >= CONFIG.resetHour) x.setDate(x.getDate()+1); return dateKey(x); }

const addDays = (k, n) => { const [y, m, d] = k.split('-').map(Number); return dateKey(new Date(y, m - 1, d + n)); };

const itemTitle = i => i.name + (i.sizeName ? ' · ' + i.sizeName : '');
const topLabel = t => t.removed ? 'ไม่รับ ' + topName(t.name) : (t.add ? 'เพิ่ม ' : '') + topName(t.name) + (t.n > 1 ? ' ×' + t.n : '') + (t.from ? ` (แทน ${topName(t.from)})` : '') + (t.extra ? ` (+${t.extra})` : '');
/* ตอนพิมพ์: เมนูที่มีท็อปปิ้งตามสูตร (Acai, Banana Choco) แสดงเฉพาะช่องที่เปลี่ยนหรือไม่รับ · Greek แสดงทั้งหมด */
const printTops = i => MENU[i.menu] && MENU[i.menu].defaults ? i.tops.filter(t => t.from || t.removed || t.add) : i.tops;
function itemLines(i, forPrint){
  const L = [], tops = forPrint ? printTops(i) : i.tops;
  if(tops.length) L.push(tops.map(topLabel).join(', '));
  else if(i.menu === 'greek') L.push('ไม่มีท็อปปิ้ง');
  if(i.sep) L.push(`แยกท็อปปิ้ง (+${i.sep})`);   // sep = เงินที่คิดตอนขาย
  if(i.honey !== undefined) L.push('น้ำผึ้ง: ' + HONEY[i.honey].name);   // Banana Choco ไม่มีน้ำผึ้ง
  if(i.note) L.push('หมายเหตุ: ' + i.note);
  return L;
}

function historyText(s){ return (s.log || []).map(l => `${l.act === 'void' ? 'ยกเลิก' : 'นำกลับ'} ${fmtDT(l.at)}`).join(' / '); }

function csvText(rows){ const q = v => `"${String(v).replace(/"/g, '""')}"`; return rows.map(r => r.map(q).join(',')).join('\r\n'); }

<script>
/* ===== js/pricing.js ===== */
/* คิดราคา: ฟังก์ชันล้วน ไม่แตะ DOM และไม่อ่าน state ของหน้าจอ (เทสต์ได้ตรงๆ)
   m = เมนูจาก CONFIG.menus · st = {size, picks, comps, adds, sep} แบบเดียวกับ sel */
function priceBase(m, st){
  if(!m) return null;
  if(m.sizes){
    const s = m.sizes.find(x => x.id === st.size);
    let unit = s.price, free = 0; const tops = [];
    if(!s.noTop) st.picks.forEach(n => {           // เลือกซ้ำได้ (Banana ×3) นับทีละชิ้น
      const it = ITEM[n]; let extra = 0;
      if(s.perTop) extra = s.perTop;                 // ขนาดคิดท็อปปิ้งราคาเดียว (69: ชิ้นละ 15 ทุกอย่าง)
      else if(it.price > 0) extra = it.price;
      else { free++; if(free > CONFIG.freeToppingCount) extra = CONFIG.overToppingPrice; }
      unit += extra;
      let t = tops.find(x => x.name === n);
      if(!t){ t = {name:n, n:0, extra:0, from:null}; tops.push(t); }
      t.n++; t.extra += extra; if(extra) t.each = extra;   // each = ราคาต่อชิ้นที่คิด (ใช้กับโปรฟรี 1 ท็อปปิ้ง)
    });
    return {unit, tops, sizeName: sizeLabel(s), freeUsed:free, noTop:!!s.noTop, perTop:s.perTop || 0};
  }
  /* Acai / Banana Choco: เปลี่ยนในหมวดเดียวกัน · ของฟรี → ของ Extra คิดตามราคาของ Extra
     ของ Extra → อย่างอื่น (รวมถึง Extra ด้วยกัน) ฟรี และไม่ลดราคา · ไม่รับ ก็ไม่ลดราคา */
  const tops = st.comps.map((n, i) => {
    const d = m.defaults[i];
    if(n === null) return {name:d, n:1, extra:0, from:null, removed:true};
    const extra = n !== d && ITEM[n].price > 0 && !(ITEM[d].price > 0) ? ITEM[n].price : 0;
    return {name:n, n:1, extra, from: n !== d ? d : null};
  });
  /* เพิ่มท็อปปิ้ง (st.adds) ชิ้นละ addTopPrice ทุกอย่าง · เลือกซ้ำได้ */
  (st.adds || []).forEach(n => {
    let t = tops.find(x => x.add && x.name === n);
    if(!t){ t = {name:n, n:0, extra:0, from:null, add:true, each:CONFIG.addTopPrice}; tops.push(t); }
    t.n++; t.extra += CONFIG.addTopPrice;
  });
  return {unit: m.price + tops.reduce((a, t) => a + t.extra, 0), tops, sizeName:'', freeUsed:0, noTop:false, perTop:0};
}

/* + แยกท็อปปิ้ง (st.sep) ต่อแก้ว · คิดเฉพาะเมื่อมีท็อปปิ้งในแก้วจริง (ไม่นับช่องที่ไม่รับ) */
function priceItem(m, st){
  const P = priceBase(m, st); if(!P) return P;
  P.sep = st.sep && P.tops.some(t => !t.removed) ? CONFIG.separateToppingPrice : 0;
  P.unit += P.sep;
  return P;
}

/* ชื่อขนาดที่เก็บในบิล (ห้ามเปลี่ยนข้อความโดยไม่จำเป็น รายงานจัดกลุ่มตามชื่อนี้) */
const sizeLabel = s => s.name + (s.perTop ? ` · ท็อปปิ้งชิ้นละ ${s.perTop}` : s.noTop ? ' · ไม่มีท็อปปิ้ง' : '');
/* แก้วขนาดคิดท็อปปิ้งทีละชิ้น / ไม่มีท็อปปิ้ง (บิลเก่า) ไม่มีโควตาฟรี · ดูจากชื่อขนาดในบิล */
const noFreeQuota = i => /ไม่มีท็อปปิ้ง|ชิ้นละ/.test(i.sizeName || '');

/* คำนวณราคารายการที่กำลังเลือกอยู่บนหน้าจอ */
const priceSel = () => priceItem(curMenu(), sel);

const menuPriceLabel = m => m.sizes ? (() => { const p = m.sizes.map(s => s.price); const lo = Math.min(...p), hi = Math.max(...p); return lo === hi ? baht(lo) : baht(lo)+'–'+hi; })() : baht(m.price);

<script>
/* ===== js/store.js ===== */
/* เก็บยอดขาย: IndexedDB เป็นที่เก็บหลัก + สำเนาสำรองใน localStorage
   - ตอนเปิดหน้า (storeReady) อ่านบิลจาก IndexedDB และ localStorage มารวมกัน แล้วถือไว้ในหน่วยความจำ
     ข้อมูลจากต้นแบบเดิม (localStorage key เดียวกัน) จึงถูกย้ายเข้า IndexedDB อัตโนมัติ และไม่ลบของเดิม
   - loadSales() / saveSales() ยังเป็นแบบ sync เหมือนเดิม ส่วนการเขียนลง IndexedDB ทำเบื้องหลังเฉพาะบิลที่เปลี่ยน
   - saveSales เพิ่มหรือแก้บิลได้อย่างเดียว ไม่ลบ (บิลที่ไม่อยู่ใน list ยังอยู่ครบ) ลบทั้งหมดได้ทาง clearSales() ซึ่งใช้เฉพาะ DEMO
   - ถ้าเบราว์เซอร์ไม่มี IndexedDB ใช้ localStorage อย่างเดียว ถ้าไม่มีทั้งคู่ใช้หน่วยความจำ + แถบเตือน */
const KEY = 'geek_popup_sales_DEMO2';
const DB_STORE = 'sales';

let ROWS = [];               // JSON ของแต่ละบิล เรียงตามลำดับที่บันทึก
const ROW_AT = new Map();    // id → ตำแหน่งใน ROWS
let DB = null, STORE_MODE = 'loading', LS_OK = true, DB_FAILS = 0;

function storeBanner(id, text){
  if(document.getElementById(id)) return;
  const b = document.createElement('div'); b.id = id;
  b.style.cssText = 'background:#c62828;color:#fff;text-align:center;padding:6px 10px;font-size:14px';
  b.innerHTML = icon('alert', 16) + ' ' + esc(text);
  document.body.prepend(b);
}
function memMode(){
  STORE_MODE = 'memory';
  storeBanner('memBanner', 'เบราว์เซอร์นี้ไม่ให้บันทึกข้อมูลถาวร ยอดขายจะหายเมื่อปิดหน้า กรุณาส่งออก CSV ก่อนปิด');
}

/* บิลที่ log ยาวกว่าคือฉบับใหม่กว่า (log เพิ่มได้อย่างเดียว) เท่ากันใช้ตัวแรก */
const newerSale = (a, b) => ((b.log || []).length > (a.log || []).length ? b : a);
function putRow(s){
  const j = JSON.stringify(s);
  if(ROW_AT.has(s.id)){ const i = ROW_AT.get(s.id); if(ROWS[i] === j) return false; ROWS[i] = j; }
  else { ROW_AT.set(s.id, ROWS.length); ROWS.push(j); }
  return true;
}

const idbReq = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
function openDb(){
  return new Promise((ok, no) => {
    const r = indexedDB.open(KEY, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE, {keyPath: 'id'});
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); r.onblocked = () => no(new Error('blocked'));
  });
}
function dbWrite(list, clear){
  if(!DB) return;
  try{
    const tx = DB.transaction(DB_STORE, 'readwrite'), st = tx.objectStore(DB_STORE);
    if(clear) st.clear();
    list.forEach(s => st.put(s));
    tx.onabort = dbFailed;     // request ที่ error จะทำให้ทั้ง transaction ถูก abort
  }catch(e){ dbFailed(); }
}
function dbFailed(){
  DB_FAILS++; console.error('IndexedDB write failed');
  if(!LS_OK) storeBanner('dbBanner', 'บันทึกยอดขายลงเครื่องไม่สำเร็จ กรุณาส่งออก CSV ทันที แล้วแจ้งผู้ดูแล');
}
function lsRead(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ LS_OK = false; return null; }
}
function lsWrite(){
  if(!LS_OK && DB) return;     // พื้นที่ localStorage เต็มแล้ว ใช้ IndexedDB อย่างเดียว
  try{ localStorage.setItem(KEY, '[' + ROWS.join(',') + ']'); LS_OK = true; }
  catch(e){ LS_OK = false; if(!DB) memMode(); }
}

async function openStore(){
  const fromLs = lsRead();
  let fromDb = null;
  if(typeof indexedDB !== 'undefined'){
    try{ DB = await openDb(); fromDb = await idbReq(DB.transaction(DB_STORE).objectStore(DB_STORE).getAll()); }
    catch(e){ DB = null; }
  }
  if(!DB && fromLs === null){ memMode(); return; }
  STORE_MODE = DB ? 'indexeddb' : 'localstorage';
  /* รวมสองแหล่ง: เรียงตาม id (= เวลาที่ขาย) ถ้ามีทั้งคู่ใช้ฉบับที่ log ยาวกว่า */
  const byId = new Map();
  (fromDb || []).forEach(s => byId.set(s.id, s));
  (fromLs || []).forEach(s => byId.set(s.id, byId.has(s.id) ? newerSale(byId.get(s.id), s) : s));
  [...byId.values()].sort((a, b) => a.id - b.id).forEach(putRow);
  const dbIds = new Map((fromDb || []).map(s => [s.id, JSON.stringify(s)]));
  const missing = ROWS.map(j => JSON.parse(j)).filter(s => dbIds.get(s.id) !== JSON.stringify(s));
  if(missing.length) dbWrite(missing);                    // migration จาก localStorage (และบิลที่ IndexedDB ตกหล่น)
  if(ROWS.length) lsWrite();                              // สำเนาสำรองให้ตรงกัน
  if(DB && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});  // ขอไม่ให้เบราว์เซอร์ล้างข้อมูลเอง
}
const storeReady = openStore().catch(e => { console.error(e); memMode(); });

function loadSales(){ return JSON.parse('[' + ROWS.join(',') + ']'); }
function saveSales(list){
  const changed = list.filter(putRow);
  if(changed.length){ dbWrite(changed); lsWrite(); }
  return true;
}
/* ลบบิลทั้งหมด · ใช้เฉพาะปุ่มสร้างข้อมูลตัวอย่างใหม่ใน DEMO ห้ามใช้กับข้อมูลจริง */
function clearSales(){
  ROWS = []; ROW_AT.clear();
  dbWrite([], true); LS_OK = true; lsWrite();
}
function nextNo(){ const biz = bizDate(new Date()); return (loadSales().filter(s => s.date === biz).length % 999) + 1; }
</script>
<script>
/* ===== js/reports.js ===== */
/* ====== รายงานสรุป: คำนวณตัวเลข (ไม่แตะ DOM) ====== */
const REP = {from:null, to:null, tab:'items', fb:false};

const thDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'}); };
function roundLabel(from, to){
  const start = k => `${thDate(addDays(k, -1))} ${pad(CONFIG.resetHour)}:00`, end = k => `${thDate(k)} ${pad(CONFIG.resetHour - 1)}:59`;
  return from === to ? `รอบขาย ${thDate(from)} (${start(from)} – ${end(from)})` : `รอบขาย ${thDate(from)} – ${thDate(to)} (${start(from)} – ${end(to)})`;
}
/* รอบที่จะเปิดให้ดู: รอบปัจจุบัน ถ้ายังไม่มีบิลให้ใช้รอบล่าสุดที่มีการขาย */
function defaultRound(){
  const cur = bizDate(new Date()), sales = loadSales();
  if(sales.some(x => x.date === cur)) return {date:cur, fallback:false};
  const past = sales.map(x => x.date).filter(d => d < cur).sort();
  return past.length ? {date:past[past.length - 1], fallback:true} : {date:cur, fallback:false};
}

function setRange(k){
  const today = bizDate(new Date());
  REP.fb = false;
  if(k === 'yday') REP.from = REP.to = addDays(today, -1);
  else if(k === '7d'){ REP.from = addDays(today, -6); REP.to = today; }
  else if(k === 'all'){ const ds = loadSales().map(x => x.date).sort(); REP.from = ds[0] || today; REP.to = ds[ds.length - 1] || today; }
  else REP.from = REP.to = today;
}
const pct = (v, t) => t ? Math.round(v * 1000 / t) / 10 : 0;

/* รวมตัวเลขทั้งหมดจากบิลที่ไม่ถูกยกเลิก */
function buildReport(from, to){
  const all = loadSales().filter(x => x.date >= from && x.date <= to);
  const ok = all.filter(x => !x.void);
  const R = {all, ok, voided: all.length - ok.length, total: ok.reduce((a, x) => a + x.total, 0), bills: ok.length, cups: 0,
             items: {}, methods: {}, groups: {}, ingr: {}, topCups: 0, fewCups: 0, discount: 0};
  const grp = (g, unit, o, qty, rev) => { const G = R.groups[g] || (R.groups[g] = {unit, rows:{}}); const r = G.rows[o] || (G.rows[o] = {qty:0, rev:0}); r.qty += qty; r.rev += rev; };
  const ing = (sec, name, qty) => { const k = sec + '|' + name; (R.ingr[k] = R.ingr[k] || {sec, name, qty:0}).qty += qty; };
  CONFIG.methods.forEach(m => R.methods[m.id] = {bills:0, rev:0});
  ok.forEach(sale => {
    if(R.methods[sale.method]){ R.methods[sale.method].bills++; R.methods[sale.method].rev += sale.total; }
    if(sale.promo){ R.discount += sale.promo.discount; grp('โปรโมชัน', 'บิล', sale.promo.name, 1, sale.promo.discount); }
    grp('กินเลย / กลับบ้าน', 'บิล', DINE[sale.dining] ? DINE[sale.dining].name : String(sale.dining), 1, sale.total);
    sale.items.forEach(i => {
      const rev = i.unit * i.qty; R.cups += i.qty;
      /* Greek ที่มีโควตาท็อปปิ้งฟรี · fewTops = ลูกค้าขอน้อยกว่าโควตา (ไว้เทียบสต็อก) */
      if(i.menu === 'greek' && !noFreeQuota(i)) R.topCups += i.qty;
      if(i.fewTops !== undefined){ R.fewCups += i.qty; grp('ท็อปปิ้งฟรีไม่ครบ ' + CONFIG.freeToppingCount + ' อย่าง', 'แก้ว', i.fewTops ? `เลือก ${i.fewTops} อย่าง` : 'ไม่เอาท็อปปิ้งฟรี', i.qty, rev); }
      const key = itemTitle(i);
      const it = R.items[key] || (R.items[key] = {menu:i.menu, name:key, qty:0, rev:0}); it.qty += i.qty; it.rev += rev;
      if(i.sizeName) grp('ขนาด', 'แก้ว', i.sizeName, i.qty, rev);
      if(i.sep) grp('แยกท็อปปิ้ง', 'แก้ว', i.name, i.qty, i.sep * i.qty);
      if(i.honey !== undefined) grp('น้ำผึ้ง', 'แก้ว', HONEY[i.honey] ? HONEY[i.honey].name : String(i.honey), i.qty, rev);
      if(i.menu === 'greek') ing('base', 'Greek Yogurt (สกู๊ป)', (parseInt(i.sizeName, 10) || 1) * i.qty);
      else ing('base', i.name + ' base (ถ้วย)', i.qty);
      i.tops.forEach(t => {
        const n = (t.n || 1) * i.qty;
        if(t.removed){ grp('การปรับท็อปปิ้ง', 'แก้ว', `${i.name}: ไม่รับ ${topName(t.name)}`, i.qty, 0); return; }
        if(t.from) grp('การปรับท็อปปิ้ง', 'แก้ว', `${i.name}: เปลี่ยน ${topName(t.from)} → ${topName(t.name)}`, i.qty, 0);
        if(t.add) grp('การปรับท็อปปิ้ง', 'แก้ว', `${i.name}: เพิ่ม ${topName(t.name)}`, i.qty, 0);
        ing(ITEM[t.name] ? ITEM[t.name].cat : 'other', topName(t.name), n);
        if(t.extra){
          const isExtra = ITEM[t.name] && ITEM[t.name].price > 0, perTop = i.menu === 'greek' && noFreeQuota(i);
          const pcs = isExtra || perTop || t.add ? n : Math.round(t.extra / CONFIG.overToppingPrice) * i.qty;
          grp('ท็อปปิ้งที่คิดเงินเพิ่ม', 'ชิ้น', t.add ? `${topName(t.name)} (เพิ่มใน ${i.name})` : perTop ? `${topName(t.name)} (แก้วคิดทีละชิ้น)` : isExtra ? topName(t.name) : `${topName(t.name)} (เกิน ${CONFIG.freeToppingCount} ชิ้น)`, pcs, t.extra * i.qty);
        }
      });
      if(i.honey !== undefined && i.honey !== 'none') ing('honey', 'น้ำผึ้ง · ' + (HONEY[i.honey] ? HONEY[i.honey].name : i.honey), i.qty);
    });
  });
  return R;
}

<script>
/* ===== js/printer.js ===== */
/* ปริ้นเตอร์ความร้อน ESC/POS (Xprinter XP-Q807K 80 มม. ผ่าน USB)
   - ESCPOS / rasterize / rasterCmds / bytes : สร้าง byte ล้วน ไม่แตะ DOM (เทสต์ใน node ได้)
   - renderSlip : วาดตั๋วลง canvas · ภาษาไทยส่งเป็นภาพเสมอ ไม่พึ่งฟอนต์ในปริ้นเตอร์
   - UsbPrinter : เชื่อมและส่งข้อมูลผ่าน WebUSB (ต้องเปิดหน้าผ่าน https หรือ localhost) */
const PRINTER = {
  dots: 576,        // ความกว้างพิมพ์ 80 มม. ≈ 576 จุดที่ 203 dpi (บางรุ่นพิมพ์ได้ 512)
  chunk: 4096,      // ส่งข้อมูลทีละกี่ byte
  threshold: 160,   // ความสว่างต่ำกว่านี้ = จุดดำ (สูงขึ้น = เข้มขึ้น)
  band: 256,        // แบ่งภาพเป็นแถบละกี่แถว ต่อ 1 คำสั่ง GS v 0 (กันบัฟเฟอร์ปริ้นเตอร์เต็ม)
};

const ESCPOS = {
  init:    () => [0x1B, 0x40],                         // ESC @  รีเซ็ตปริ้นเตอร์
  feed:    n => [0x1B, 0x64, n],                       // ESC d n  เลื่อนกระดาษ n บรรทัด
  cut:     () => [0x1D, 0x56, 0x42, 0x00],             // GS V 66 0  เลื่อนถึงใบมีดแล้วตัด (เหลือติดนิดหน่อย)
  fullCut: () => [0x1D, 0x56, 0x41, 0x00],             // GS V 65 0  เลื่อนถึงใบมีดแล้วตัดขาด
  drawer:  (pin = 0) => [0x1B, 0x70, pin, 25, 250],    // ESC p m 25 250  เปิดลิ้นชัก (pin 0 = ขา 2, 1 = ขา 5)
  text:    s => [...String(s)].map(c => c.charCodeAt(0) < 128 ? c.charCodeAt(0) : 0x3F).concat(0x0A), // ASCII เท่านั้น
};

/* รวม array / Uint8Array หลายก้อนเป็น Uint8Array เดียว */
function bytes(...parts){
  const n = parts.reduce((a, p) => a + p.length, 0), out = new Uint8Array(n); let o = 0;
  parts.forEach(p => { out.set(p, o); o += p.length; });
  return out;
}

/* ภาพ RGBA (ImageData หรือ {width, height, data}) → บิตขาวดำ 1 บิต/จุด เรียงแถวละ widthBytes */
function rasterize(img, threshold = PRINTER.threshold){
  const wb = Math.ceil(img.width / 8), bits = new Uint8Array(wb * img.height), d = img.data;
  for(let y = 0; y < img.height; y++) for(let x = 0; x < img.width; x++){
    const i = (y * img.width + x) * 4;
    const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    if(d[i + 3] >= 128 && lum < threshold) bits[y * wb + (x >> 3)] |= 0x80 >> (x & 7);   // โปร่งใส = ขาว
  }
  return {widthBytes: wb, height: img.height, bits};
}

/* บิตภาพ → คำสั่ง GS v 0 แบ่งเป็นแถบ */
function rasterCmds(r, band = PRINTER.band){
  const parts = [];
  for(let y = 0; y < r.height; y += band){
    const h = Math.min(band, r.height - y);
    parts.push([0x1D, 0x76, 0x30, 0x00, r.widthBytes & 255, r.widthBytes >> 8, h & 255, h >> 8]);
    parts.push(r.bits.subarray(y * r.widthBytes, (y + h) * r.widthBytes));
  }
  return bytes(...parts);
}

/* ---------- วาดตั๋วลง canvas ----------
   blocks: {text, size, bold, align:'left'|'center'|'right', invert}  ข้อความ (ตัดบรรทัดอัตโนมัติ)
           {left, right, size, bold}                                   ซ้าย-ขวาในบรรทัดเดียว
           {rule:'dash'|'solid'} เส้นคั่น · {gap:n} เว้นที่ว่าง n จุด */
const SLIP_FONT = '"Noto Sans Thai", "Sarabun", sans-serif';
function renderSlip(blocks, dots = PRINTER.dots, canvas){
  canvas = canvas || document.createElement('canvas');
  const ctx = canvas.getContext('2d'), M = 8, W = dots - M * 2, ops = [];
  const font = b => `${b.bold ? 700 : 400} ${b.size || 26}px ${SLIP_FONT}`;
  const words = s => typeof Intl !== 'undefined' && Intl.Segmenter
    ? [...new Intl.Segmenter('th', {granularity:'word'}).segment(s)].map(x => x.segment) : [...s];
  const wrap = (s, maxW) => {
    const out = []; let cur = '';
    words(s).forEach(w => {
      if(ctx.measureText(cur + w).width <= maxW || !cur) cur += w;
      else { out.push(cur.trimEnd()); cur = w.trimStart(); }
      while(ctx.measureText(cur).width > maxW && cur.length > 1){            // คำเดียวยาวเกินบรรทัด: ตัดทีละตัว
        let k = cur.length - 1; while(k > 1 && ctx.measureText(cur.slice(0, k)).width > maxW) k--;
        out.push(cur.slice(0, k)); cur = cur.slice(k);
      }
    });
    if(cur || !out.length) out.push(cur);
    return out;
  };
  let y = 0;
  blocks.forEach(b => {
    if(b.gap){ y += b.gap; return; }
    if(b.rule){ ops.push({rule:b.rule, y: y + 8}); y += 16; return; }
    const size = b.size || 26, lh = Math.round(size * 1.45);
    ctx.font = font(b);
    if('left' in b){
      const rw = ctx.measureText(b.right || '').width;
      wrap(b.left, W - rw - 12).forEach((t, i) => { ops.push({b, t, x:M, y, lh, align:'left'}); if(!i && b.right) ops.push({b, t:b.right, x:M + W, y, lh, align:'right'}); y += lh; });
      return;
    }
    wrap(b.text, W).forEach(t => { ops.push({b, t, y, lh, align:b.align || 'left', x: b.align === 'center' ? dots / 2 : b.align === 'right' ? M + W : M}); y += lh; });
  });
  canvas.width = dots; canvas.height = Math.max(1, Math.ceil(y + 8));
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ops.forEach(o => {
    if(o.rule){ ctx.fillStyle = '#000'; if(o.rule === 'solid') ctx.fillRect(M, o.y - 1, W, 3); else for(let x = M; x < M + W; x += 14) ctx.fillRect(x, o.y - 1, 8, 2); return; }
    const size = o.b.size || 26;
    if(o.b.invert){ ctx.fillStyle = '#000'; ctx.fillRect(0, o.y, dots, o.lh); }
    ctx.fillStyle = o.b.invert ? '#fff' : '#000'; ctx.font = font(o.b); ctx.textAlign = o.align; ctx.textBaseline = 'alphabetic';
    ctx.fillText(o.t, o.x, o.y + Math.round(size * 1.1));
  });
  return canvas;
}
/* canvas → คำสั่งพิมพ์ภาพ */
const canvasCmds = (canvas, threshold) => rasterCmds(rasterize(canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height), threshold));

/* ---------- WebUSB ---------- */
const hex4 = n => '0x' + n.toString(16).padStart(4, '0');
class UsbPrinter {
  constructor(){ this.dev = null; this.iface = null; this.ep = null; }
  static supported(){ return typeof navigator !== 'undefined' && !!navigator.usb; }
  /* หา endpoint แบบ bulk OUT (เลือก interface class 7 = Printer ก่อน) */
  static findOut(cfg){
    let best = null;
    cfg.interfaces.forEach(it => (it.alternates || [it.alternate]).forEach(alt => alt.endpoints.forEach(e => {
      if(e.direction !== 'out' || e.type !== 'bulk') return;
      const c = {iface: it.interfaceNumber, alt: alt.alternateSetting, ep: e.endpointNumber, cls: alt.interfaceClass, packet: e.packetSize};
      if(!best || (c.cls === 7 && best.cls !== 7)) best = c;
    })));
    return best;
  }
  static describe(d){
    const L = [`${d.manufacturerName || '?'} / ${d.productName || '?'} · vendor ${hex4(d.vendorId)} product ${hex4(d.productId)}${d.serialNumber ? ' · SN ' + d.serialNumber : ''}`];
    (d.configurations || []).forEach(c => c.interfaces.forEach(it => (it.alternates || []).forEach(a =>
      L.push(`  config ${c.configurationValue} · interface ${it.interfaceNumber}.${a.alternateSetting} class ${a.interfaceClass} · ` +
        (a.endpoints.map(e => `ep${e.endpointNumber} ${e.direction} ${e.type} ${e.packetSize}B`).join(', ') || 'ไม่มี endpoint')))));
    return L.join('\n');
  }
  get connected(){ return !!(this.dev && this.dev.opened && this.ep !== null); }
  async request(){ return this.open(await navigator.usb.requestDevice({filters: []})); }
  /* เครื่องที่เคยอนุญาตแล้ว เชื่อมได้โดยไม่ต้องเลือกใหม่ */
  async reconnect(){ const list = await navigator.usb.getDevices(); if(!list.length) return null; return this.open(list[0]); }
  async open(d){
    if(!d.opened) await d.open();
    if(!d.configuration) await d.selectConfiguration(1);
    const f = UsbPrinter.findOut(d.configuration);
    if(!f) throw new Error('ไม่พบช่องส่งข้อมูล (bulk OUT) ในอุปกรณ์นี้');
    await d.claimInterface(f.iface);
    if(f.alt) await d.selectAlternateInterface(f.iface, f.alt);
    this.dev = d; this.iface = f.iface; this.ep = f.ep; this.found = f;
    return d;
  }
  async send(data, chunk = PRINTER.chunk){
    if(!this.connected) throw new Error('ยังไม่ได้เชื่อมปริ้นเตอร์');
    for(let i = 0; i < data.length; i += chunk){
      const r = await this.dev.transferOut(this.ep, data.subarray(i, i + chunk));
      if(r.status !== 'ok') throw new Error(`ส่งข้อมูลไม่สำเร็จ (${r.status}) ที่ byte ${i}`);
    }
    return data.length;
  }
  async close(){ const d = this.dev; this.dev = null; this.ep = null; if(d && d.opened){ try{ await d.releaseInterface(this.iface); }catch(e){} await d.close(); } }
  forget(){ this.dev = null; this.ep = null; }
}

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      for (var i = 0; i < 15; i += 1) {

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;

        } else {

        }

      _modules[_moduleCount - 8][8] = (!test);

      var bitIndex = 7;

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }

<script>
/* ===== js/promptpay.js ===== */
/* QR PromptPay ใส่ยอด (มาตรฐาน EMVCo / Thai QR Payment) สร้างในเครื่อง ใช้ได้แม้ไม่มีเน็ต
   - PP.payload(id, amount) : ข้อความใน QR · ฟังก์ชันล้วน ไม่แตะ DOM (เทสต์เทียบกับ promptpay-qr)
   - qrMatrix / qrSvg       : วาด QR ด้วย js/vendor/qrcode.js (qrcode-generator, MIT) */
const PP = {
  clean: s => String(s || '').replace(/\D/g, ''),
  /* เบอร์มือถือ 10 หลัก · เลขบัตรประชาชน/ผู้เสียภาษี 13 หลัก · e-Wallet 15 หลัก */
  type(id){ id = PP.clean(id); return id.length === 10 && id[0] === '0' ? 'phone' : id.length === 13 ? 'tax' : id.length === 15 ? 'ewallet' : null; },
  /* หลักสุดท้ายของเลข 13 หลักคือหลักตรวจสอบ (mod 11) จับเลขพิมพ์ผิดได้ */
  taxIdOk(id){
    if(!/^\d{13}$/.test(id)) return false;
    let sum = 0; for(let i = 0; i < 12; i++) sum += Number(id[i]) * (13 - i);
    return (11 - sum % 11) % 10 === Number(id[12]);
  },
  /* ข้อความบอกว่าเลขผิดตรงไหน ('' = ใช้ได้) */
  problem(id){
    id = PP.clean(id);
    if(!id) return 'ยังไม่ได้ใส่เลข';
    const t = PP.type(id);
    if(!t) return `เลขมี ${id.length} หลัก ต้องเป็นเบอร์มือถือ 10 หลัก หรือเลขบัตร/ผู้เสียภาษี 13 หลัก`;
    if(t === 'tax' && !PP.taxIdOk(id)) return 'เลข 13 หลักไม่ถูกต้อง (หลักตรวจสอบไม่ตรง) ลองเช็กว่าพิมพ์ผิดหรือไม่';
    return '';
  },
  /* แสดงผลแบบแบ่งกลุ่ม อ่านง่าย */
  format(id){
    id = PP.clean(id); const t = PP.type(id);
    if(t === 'phone') return id.replace(/^(\d{3})(\d{3})(\d{4})$/, '$1-$2-$3');
    if(t === 'tax') return id.replace(/^(\d)(\d{4})(\d{5})(\d{2})(\d)$/, '$1-$2-$3-$4-$5');
    return id;
  },
  crc16(s){   // CRC-16/CCITT-FALSE (poly 0x1021, เริ่ม 0xFFFF)
    let c = 0xFFFF;
    for(let i = 0; i < s.length; i++){ c ^= s.charCodeAt(i) << 8; for(let k = 0; k < 8; k++) c = c & 0x8000 ? (c << 1) ^ 0x1021 : c << 1; c &= 0xFFFF; }
    return c.toString(16).toUpperCase().padStart(4, '0');
  },
  payload(id, amount){
    id = PP.clean(id); const t = PP.type(id);
    if(!t) throw new Error('เลข PromptPay ไม่ถูกต้อง');
    const f = (tag, v) => tag + String(v.length).padStart(2, '0') + v;
    const target = t === 'phone' ? '0066' + id.slice(1) : id;   // เบอร์: 0812345678 → 0066812345678
    const s = f('00', '01') + f('01', amount ? '12' : '11') +   // 12 = QR ใช้ครั้งเดียวมียอด · 11 = QR ถาวร
      f('29', f('00', 'A000000677010111') + f({phone:'01', tax:'02', ewallet:'03'}[t], target)) +
      f('58', 'TH') + f('53', '764') + (amount ? f('54', Number(amount).toFixed(2)) : '') + '6304';
    return s + PP.crc16(s);
  },
};

/* ข้อความ → ตาราง QR (true = จุดดำ) */
function qrMatrix(text){
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount();
  return Array.from({length:n}, (_, r) => Array.from({length:n}, (_, c) => q.isDark(r, c)));
}
/* ข้อความ → <svg> QR (มีขอบขาว 4 ช่องตามมาตรฐาน) */
function qrSvg(text, size = 240){
  const m = qrMatrix(text), n = m.length, Q = 4; let d = '';
  m.forEach((row, r) => row.forEach((on, c) => { if(on) d += `M${c + Q} ${r + Q}h1v1h-1z`; }));
  return `<svg class="qr" viewBox="0 0 ${n + Q * 2} ${n + Q * 2}" width="${size}" height="${size}" shape-rendering="crispEdges" role="img" aria-label="QR PromptPay">` +
    `<rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

<script>
/* ===== js/promo.js ===== */
/* โปรโมชัน: คำนวณจากรายการในตะกร้า (ฟังก์ชันล้วน ไม่แตะ DOM)
   1 บิลใช้ได้ 1 โปร · ค่าที่บวกเพิ่ม (เปลี่ยน/เพิ่มท็อปปิ้ง, แยกท็อปปิ้ง) คิดตามปกติ โปรลดเฉพาะราคาเมนูหรือท็อปปิ้ง 1 ชิ้น
   promoEval(p, items, want) → {ok:false, why} หรือ {ok:true, discount, detail, target, targets}
   want = {key, top} เป้าหมายที่พนักงานเลือก (ลด 30 / ฟรี 1 ท็อปปิ้ง) ถ้าไม่มีหรือหาไม่เจอ ใช้รายการแรก */
const PROMO = byId(CONFIG.promos);
const menuNames = ids => ids.map(id => MENU[id] ? MENU[id].name : id).join(' หรือ ');
function promoEval(p, items, want){
  const pickTarget = targets => targets.find(t => want && t.key === want.key && (t.top || null) === (want.top || null)) || targets[0];
  if(p.type === 'b1g1'){
    /* แก้วที่ราคาเมนูถูกที่สุดฟรี 1 แก้ว (ถ้ามี 149 ฟรี 149 เสมอ) · ต้องมีอย่างน้อย 2 แก้ว */
    const el = items.filter(i => p.menus.includes(i.menu));
    if(el.reduce((a, i) => a + i.qty, 0) < 2) return {ok:false, why:`ต้องมี ${menuNames(p.menus)} อย่างน้อย 2 แก้ว`};
    const base = i => MENU[i.menu].price;
    const free = el.reduce((a, i) => base(i) < base(a) ? i : a);
    const t = {key:free.key, label:itemTitle(free), discount:base(free)};
    return {ok:true, discount:t.discount, detail:`${itemTitle(free)} ฟรี 1 แก้ว`, target:t, targets:[t]};
  }
  if(p.type === 'off'){
    const targets = items.filter(i => p.menus.includes(i.menu)).map(i => ({key:i.key, label:[itemTitle(i), ...itemLines(i)].join(' · '), discount:Math.min(p.amount, i.unit)}));
    if(!targets.length) return {ok:false, why:`ต้องมี ${menuNames(p.menus)} อย่างน้อย 1 แก้ว`};
    const t = pickTarget(targets);
    return {ok:true, discount:t.discount, detail:`${itemTitle(items.find(i => i.key === t.key))} 1 แก้ว`, target:t, targets};
  }
  if(p.type === 'freetop'){
    /* ท็อปปิ้งที่ต้องจ่าย (มี each) 1 ชิ้น ไม่รวมรายการที่ยกเว้น */
    const targets = [];
    items.forEach(i => i.tops.forEach(t => {
      if(t.removed || !t.each || p.exclude.includes(t.name)) return;
      targets.push({key:i.key, top:t.name, label:`${topName(t.name)} · ${itemTitle(i)}`, discount:t.each});
    }));
    if(!targets.length) return {ok:false, why:'ยังไม่มีท็อปปิ้งที่ต้องจ่าย (ไม่นับ กราโนล่า บลูเบอร์รี่ สตรอว์เบอร์รี่)'};
    const t = pickTarget(targets);
    return {ok:true, discount:t.discount, detail:`${topName(t.top)} ฟรี 1 ชิ้น (${itemTitle(items.find(i => i.key === t.key))})`, target:t, targets};
  }
  return {ok:false, why:'ไม่รู้จักโปรนี้'};
}
</script>
<script>
/* ===== js/ui/modal.js ===== */
/* ---------- ตัวช่วยหน้าจอ: $, toast, modal, ยืนยัน, PIN ---------- */
const $ = id => document.getElementById(id);

function toast(msg, ic){ const t = $('toast'); t.innerHTML = (ic ? icon(ic, 18) + ' ' : '') + esc(msg); t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(()=> t.style.display='none', 1800); }

/* ---------- Modal ---------- */
function openModal(html, wide){ $('modal').innerHTML = `<div class="box ${wide?'wide':''}">${html}</div>`; $('modal').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); $('modal').innerHTML = ''; }
/* หน้าต่างยืนยัน/PIN ของระบบเอง (ไม่ใช้ confirm/prompt ของเบราว์เซอร์ เพราะบางโหมดเปิดไฟล์จะถูกบล็อก) */
let confirmCb = null, confirmNo = null, pinCb = null;
function askConfirm(o){
  confirmCb = o.onYes || null; confirmNo = o.onNo || null;
  openModal(`<h3>${esc(o.msg)}</h3>${o.sub ? `<p style="color:var(--mute);margin:0 0 6px">${esc(o.sub)}</p>` : ''}
    <div class="row"><button class="ghost" id="cfNo">กลับ</button><button class="pay" id="cfYes" style="background:${o.ok ? 'var(--ok)' : 'var(--bad)'}">${esc(o.yes || 'ยืนยัน')}</button></div>`);
}
function askPin(onOk, err){
  pinCb = onOk;
  openModal(`<h3>ใส่ PIN</h3>
    <input class="num" id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" style="text-align:center;letter-spacing:8px">
    ${err ? `<p style="color:var(--bad);margin:8px 0 0">${esc(err)}</p>` : ''}
    <div class="row"><button class="ghost" id="pinNo">ยกเลิก</button><button class="pay" id="pinOk">ตกลง</button></div>`);
  const i = $('pinIn'); i.focus(); i.onkeydown = e => { if(e.key === 'Enter') checkPin(); };
}
function checkPin(){
  const v = $('pinIn').value;
  if(v === CONFIG.pin){ const cb = pinCb; pinCb = null; if(cb) cb(); }
  else askPin(pinCb, 'PIN ไม่ถูกต้อง');
}
</script>

}
/* ---------- ตั๋วแบบบล็อก สำหรับ renderSlip (พิมพ์ตรงผ่าน USB) · เนื้อหาเดียวกับ receiptHtml / kitchenHtml ---------- */

function kitchenBlocks(s){
