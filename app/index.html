<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Geek Pop-up POS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A00B8">
<link rel="icon" href="icons/icon-192.png">
<style id="pageStyle"></style>
<link rel="stylesheet" href="css/pos.css">
</head>
<body>

<header>
  <h1>Geek <span>Pop-up</span> POS</h1>
  <span id="nextNo"></span>
  <button class="hbtn" id="btnPrinter"></button>
  <button class="hbtn" id="btnSummary">สรุปยอด</button>
</header>

<main>
  <section class="card">
    <div id="builder"></div>
    <button class="add" id="btnAdd" disabled>เลือกเมนูก่อน</button>
  </section>

  <aside class="card cart">
    <h2>ออเดอร์ปัจจุบัน</h2>
    <div id="cart"></div>
    <div class="total"><span>รวม</span><span id="total">฿0</span></div>
    <button class="pay" id="btnPay" disabled>ชำระเงิน</button>
    <button class="clear" id="btnClear">ล้างออเดอร์</button>
  </aside>
</main>

<div class="bar">
  <div class="sum"><small id="barCount">0 รายการ</small><span id="barTotal">฿0</span></div>
  <button id="btnPay2" disabled>ชำระเงิน</button>
</div>

<div id="modal"></div>
<div id="toast"></div>
<div id="printArea"></div>


<!-- ลำดับสำคัญ: ไฟล์หลังเรียกใช้ของไฟล์ก่อนหน้า · ใช้ <script> ธรรมดา (ไม่ใช่ module) เพื่อให้เปิดจาก file:// บนแท็บเล็ตได้ -->
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/pricing.js"></script>
<script src="js/store.js"></script>
<script src="js/reports.js"></script>
<script src="js/printer.js"></script>
<script src="js/ui/modal.js"></script>
<script src="js/ui/print.js"></script>
<script src="js/ui/builder.js"></script>
<script src="js/ui/cart.js"></script>
<script src="js/ui/pay.js"></script>
<script src="js/ui/summary.js"></script>
<script src="js/ui/main.js"></script>
</body>
</html>
